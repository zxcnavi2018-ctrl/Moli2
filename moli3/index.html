<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Molí 3 · Visión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--cian:#6ff3ff;--rojo:#ff3b4e;--navy:#0b1438}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#eef2f7;color:#e8fbff;font-family:'Baloo 2',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#vista{position:fixed;inset:0;overflow:hidden}

/* Lo que Molí mira: carpetas */
#escena{position:absolute;inset:-5%;animation:cabeza 8s ease-in-out infinite alternate}
#escena svg{width:100%;height:100%;display:block}
@keyframes cabeza{from{transform:translate(-1.2%,.5%) rotate(-.4deg)}to{transform:translate(1.2%,-.5%) rotate(.4deg)}}
/* cristal del visor: tinte y reflejo */
#cristal{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(115deg,transparent 18%,rgba(255,255,255,.22) 24%,transparent 31%,transparent 62%,rgba(255,255,255,.12) 66%,transparent 70%),
  radial-gradient(ellipse at 50% 50%,rgba(120,200,255,0) 55%,rgba(40,90,170,.22) 100%)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-family:Orbitron,sans-serif;color:var(--cian)}
#hud .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(111,243,255,.045) 0 2px,transparent 2px 5px)}
#hud .barrido{position:absolute;left:0;right:0;height:16%;background:linear-gradient(180deg,transparent,rgba(111,243,255,.10),transparent);animation:barrido 4.5s linear infinite}
@keyframes barrido{from{top:-20%}to{top:110%}}
.chip{position:absolute;top:calc(9% + 10px);font-size:clamp(10px,1.5vmin,14px);letter-spacing:.18em;padding:.35em 1em;border-radius:99px;background:rgba(8,20,48,.55);border:1px solid rgba(111,243,255,.55);box-shadow:0 0 12px rgba(111,243,255,.3);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:.4s}
#tit{left:15%}#est{right:15%}
#hud .mira{position:absolute;left:50%;top:50%;width:5vmin;height:5vmin;transform:translate(-50%,-50%);border:2px solid var(--cian);border-radius:50%;opacity:.45;filter:drop-shadow(0 0 3px rgba(0,30,60,.7))}
#objetivo{position:absolute;left:32%;top:19%;width:36%;height:52%;opacity:0;transition:opacity .6s;filter:drop-shadow(0 0 3px rgba(0,30,60,.8))}
#objetivo i{position:absolute;width:26px;height:26px;border:3px solid var(--cian);border-radius:6px}
#objetivo i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
#objetivo i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#objetivo i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
#objetivo i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#objetivo b{position:absolute;top:-2.1em;left:0;font-size:clamp(9px,1.3vmin,13px);letter-spacing:.12em;white-space:nowrap;padding:.2em .7em;border-radius:6px;background:rgba(8,20,48,.6)}
.on #objetivo{opacity:1}
body.alarma #objetivo{opacity:0}

/* Alarma falsa */
#peligro{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#peligro .rojo{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,40,70,.5) 100%);animation:latido 1.3s ease-in-out infinite}
#peligro .banda{position:absolute;left:50%;top:17%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
#peligro .txt{font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(18px,4.6vmin,48px);letter-spacing:.14em;color:#fff;white-space:nowrap;padding:.15em .8em;border-radius:16px;background:linear-gradient(rgba(255,59,78,.82),rgba(190,20,45,.82));border:2px solid #ffc2c8;box-shadow:0 0 24px rgba(255,59,78,.8);animation:parpa .65s steps(2) infinite}
#peligro .sub{font-family:Orbitron,sans-serif;font-size:clamp(9px,1.5vmin,14px);letter-spacing:.3em;color:#fff;padding:.25em 1em;border-radius:99px;background:rgba(120,0,20,.6)}
@keyframes latido{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes parpa{0%{opacity:1}100%{opacity:.45}}
body.alarma #peligro{opacity:1}
body.alarma .chip{border-color:#ff8b97;color:#ffc2c8;box-shadow:0 0 12px rgba(255,59,78,.5)}
body.alarma #borde{stroke:#ff5a6b;animation:latido 1.3s ease-in-out infinite}

/* Brazo de Molí (blanco, redondito, 3 deditos) */
#brazo{position:absolute;left:calc(6vw + 2vmin);bottom:-6vmin;width:60vmin;aspect-ratio:440/280;transform-origin:12% 60%;transform:translate(-30%,95%) rotate(-12deg);transition:transform 1.1s cubic-bezier(.2,.9,.25,1.12);pointer-events:none;filter:drop-shadow(8px 14px 16px rgba(20,40,80,.35))}
#brazo svg{width:100%;height:100%;overflow:visible}
body.brazo #brazo{transform:rotate(-36deg)}
body.bajando #brazo{transition:transform .9s cubic-bezier(.55,0,.8,.4)}
#luz{cursor:pointer;pointer-events:auto}
#luz .parp{animation:luzOn .55s steps(2) infinite}
body.ok #luz .parp{animation:none;opacity:0}
body.ok #luz .tri{stroke:#8a94a6;filter:none}
body.ok #luz .exc{fill:#8a94a6}
body.ok #codoLuz{stroke:#8a94a6;filter:none}
@keyframes luzOn{0%{opacity:1}100%{opacity:.2}}

/* Marco del visor: casco blanco */
#visor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Párpados blancos */
.parpado{position:absolute;left:-6%;right:-6%;height:53%;transition:transform .32s cubic-bezier(.6,0,.3,1);pointer-events:none;z-index:5}
.parpado.arr{top:0;border-radius:0 0 50% 50%/0 0 26% 26%;background:linear-gradient(#ffffff 0%,#f2f5f9 70%,#d6dde8 100%)}
.parpado.aba{bottom:0;border-radius:50% 50% 0 0/26% 26% 0 0;background:linear-gradient(#d6dde8 0%,#f2f5f9 30%,#ffffff 100%)}
.parpado::before{content:'';position:absolute;left:0;right:0;height:14px;border-radius:50%;background:#b8c2d1;opacity:.8}
.parpado.arr::before{bottom:0}.parpado.aba::before{top:0}
.parpado::after{content:'';position:absolute;left:8%;right:8%;height:4px;border-radius:99px;background:var(--cian);box-shadow:0 0 14px 2px var(--cian)}
.parpado.arr::after{bottom:22px}.parpado.aba::after{top:22px}
body.abierto .parpado.arr{transform:translateY(-106%)}
body.abierto .parpado.aba{transform:translateY(106%)}

/* Subtítulos */
#sub{position:absolute;left:50%;bottom:12%;transform:translateX(-50%) translateY(10px);max-width:80vw;padding:.35em 1.1em;border-radius:16px;background:rgba(8,20,48,.68);border:1px solid rgba(111,243,255,.6);box-shadow:0 0 16px rgba(111,243,255,.35);color:#fff;font-size:clamp(16px,3vmin,28px);font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:4;text-align:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#sub.ver{opacity:1;transform:translateX(-50%)}
#pista{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);font-size:clamp(13px,2.2vmin,20px);font-weight:800;color:#0b1438;background:rgba(255,255,255,.9);padding:.2em 1em;border-radius:99px;box-shadow:0 4px 14px rgba(20,40,80,.3);opacity:0;transition:opacity .4s;pointer-events:none;z-index:4;white-space:nowrap;animation:flota 1.4s ease-in-out infinite}
#pista.ver{opacity:1}
@keyframes flota{50%{transform:translateX(-50%) translateY(-5px)}}

/* Ventana holograma */
#holo{position:absolute;left:50%;top:50%;width:min(520px,84vw);transform:translate(-50%,-50%) scaleY(.02);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .25s;z-index:6;padding:22px 26px 20px;border-radius:22px;background:linear-gradient(160deg,rgba(150,245,255,.30),rgba(40,120,220,.22));border:2px solid rgba(170,250,255,.9);box-shadow:0 0 34px rgba(111,243,255,.55),inset 0 0 40px rgba(111,243,255,.25);-webkit-backdrop-filter:blur(7px) saturate(1.2);backdrop-filter:blur(7px) saturate(1.2);color:#fff;text-shadow:0 1px 4px rgba(0,40,90,.6),0 0 8px rgba(111,243,255,.6)}
#holo::before{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(200,252,255,.10) 0 2px,transparent 2px 4px);pointer-events:none}
#holo.ver{transform:translate(-50%,-50%) scaleY(1);opacity:1;pointer-events:auto;animation:titila 3s infinite}
@keyframes titila{0%,96%,100%{opacity:1}97%{opacity:.8}98%{opacity:1}99%{opacity:.85}}
#holo .cab{display:flex;align-items:center;gap:10px;font-family:Orbitron,sans-serif;font-size:clamp(14px,2.4vmin,20px);letter-spacing:.1em;border-bottom:1px dashed rgba(200,252,255,.8);padding-bottom:10px;margin-bottom:12px}
#holo .cab span{font-size:1.5em}
#holo .de{font-size:clamp(13px,2vmin,16px);opacity:.92}
#holo h2{font-size:clamp(22px,4vmin,34px);line-height:1.1;margin:6px 0 12px}
#holo ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:clamp(15px,2.4vmin,20px);margin-bottom:16px}
#holo li::before{content:'◆ ';color:var(--cian)}
#ok{display:block;margin:0 auto;font:800 clamp(17px,2.8vmin,22px) 'Baloo 2',sans-serif;color:#03222a;background:linear-gradient(#c8fdff,#41dcef);border:0;border-radius:99px;padding:.45em 1.7em;cursor:pointer;box-shadow:0 0 18px rgba(111,243,255,.9);transition:transform .15s;text-shadow:none}
#ok:hover{transform:scale(1.06)}

/* Pantalla de inicio */
#inicio{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 38%,#ffffff,#dfe6f0 60%,#c3cede);text-align:center;padding:16px;transition:opacity .5s;color:#0b1438}
#inicio .ojos{display:flex;gap:4vmin;padding:3vmin 5vmin;border-radius:999px;background:var(--navy);box-shadow:0 10px 30px rgba(11,20,56,.35)}
#inicio .ojos i{width:7vmin;height:7vmin;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e4fdff,#7ef1ff 45%,#2fb4ff);box-shadow:0 0 18px #5fd0ff;animation:parpI 4s infinite}
@keyframes parpI{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#inicio h1{font-family:Orbitron,sans-serif;font-size:clamp(32px,8vmin,78px);letter-spacing:.08em}
#inicio p{font-size:clamp(16px,2.6vmin,22px);opacity:.8}
#encender{font:800 clamp(20px,3.6vmin,30px) 'Baloo 2',sans-serif;color:#fff;background:linear-gradient(#2a3f8f,#0b1438);border:0;border-radius:99px;padding:.4em 1.6em;cursor:pointer;box-shadow:0 8px 24px rgba(11,20,56,.4),0 0 0 4px rgba(111,243,255,.5);animation:flota2 1.6s ease-in-out infinite}
@keyframes flota2{50%{transform:translateY(-6px)}}
#inicio.fuera{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#escena,#hud .barrido{animation:none}}
</style>
</head>
<body>
<div id="vista">
  <div id="escena"><svg id="cuarto" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Un grupo de carpetas sobre la mesa"></svg></div>

  <div id="brazo">
    <svg viewBox="0 0 440 280" aria-hidden="true">
      <defs>
        <linearGradient id="gBlanco" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f4f6fa"/><stop offset=".85" stop-color="#d3dae5"/><stop offset="1" stop-color="#b9c3d2"/></linearGradient>
        <linearGradient id="gNavy" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a52a8"/><stop offset=".5" stop-color="#16246a"/><stop offset="1" stop-color="#0b1438"/></linearGradient>
        <linearGradient id="gCodo" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2b3448"/><stop offset="1" stop-color="#0d121f"/></linearGradient>
        <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <!-- brazo de arriba (sale de abajo, fuera de la vista) -->
      <path d="M-260 96 H40 Q58 96 58 116 V214 Q58 234 40 234 H-260 Z" fill="url(#gBlanco)"/>
      <path d="M-260 106 H34" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9"/>
      <!-- codo oscuro con lucecita roja -->
      <path d="M44 108 Q74 96 92 104 V226 Q74 236 44 226 Z" fill="url(#gCodo)"/>
      <circle id="codoLuz" cx="66" cy="200" r="9" fill="none" stroke="#ff2b3b" stroke-width="4" filter="url(#neon)"/>
      <!-- antebrazo cortito y abultado -->
      <path d="M84 92 C 140 52 250 44 300 66 C 346 86 350 196 300 220 C 250 244 140 238 84 210 C 70 180 70 122 84 92 Z" fill="url(#gBlanco)"/>
      <path d="M104 86 C 160 58 240 54 290 70" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <path d="M230 54 C 214 100 214 190 232 236" fill="none" stroke="#b3bdcc" stroke-width="3"/>
      <path d="M92 196 C 150 222 240 226 300 210" fill="none" stroke="#c3ccda" stroke-width="3"/>
      <!-- muñeca -->
      <path d="M316 92 Q350 96 352 156 Q350 214 316 220 Q332 156 316 92 Z" fill="url(#gBlanco)" stroke="#b3bdcc" stroke-width="3"/>
      <!-- 3 deditos azules separados -->
      <g>
        <ellipse cx="384" cy="104" rx="40" ry="17" fill="url(#gNavy)" transform="rotate(-18 384 104)"/>
        <ellipse cx="394" cy="158" rx="42" ry="17" fill="url(#gNavy)"/>
        <ellipse cx="384" cy="212" rx="40" ry="17" fill="url(#gNavy)" transform="rotate(18 384 212)"/>
        <ellipse cx="378" cy="98" rx="18" ry="5" fill="#fff" opacity=".45" transform="rotate(-18 378 98)"/>
        <ellipse cx="388" cy="152" rx="19" ry="5" fill="#fff" opacity=".45"/>
        <ellipse cx="378" cy="206" rx="18" ry="5" fill="#fff" opacity=".45" transform="rotate(18 378 206)"/>
      </g>
      <!-- luz de peligro triangular -->
      <g id="luz" role="button" aria-label="Luz de mensaje">
        <circle cx="170" cy="148" r="80" fill="transparent"/>
        <circle class="parp" cx="170" cy="148" r="62" fill="#ff2b3b" opacity=".18" filter="url(#neon)"/>
        <g class="parp" stroke="#ff2b3b" stroke-width="4" stroke-linecap="round" filter="url(#neon)">
          <path d="M170 92 V76"/><path d="M128 106 L116 94"/><path d="M212 106 L224 94"/>
          <path d="M112 162 H96"/><path d="M228 162 H244"/><path d="M134 196 L122 208"/><path d="M206 196 L218 208"/>
        </g>
        <path d="M170 100 Q178 100 182 108 L212 170 Q216 182 202 182 H138 Q124 182 128 170 L158 108 Q162 100 170 100 Z" fill="#141a2a" stroke="#c9d1dd" stroke-width="5"/>
        <path class="tri" d="M170 116 L200 172 H140 Z" fill="none" stroke="#ff2b3b" stroke-width="5" stroke-linejoin="round" filter="url(#neon)"/>
        <rect class="exc" x="166" y="134" width="8" height="22" rx="4" fill="#ff2b3b"/>
        <circle class="exc" cx="170" cy="164" r="4.5" fill="#ff2b3b"/>
      </g>
    </svg>
  </div>

  <div id="cristal"></div>
  <div id="peligro"><div class="rojo"></div><div class="banda"><div class="txt">⚠ DANGER · DANGER ⚠</div><div class="sub">ALERTA ENTRANTE</div></div></div>

  <div id="hud">
    <div class="scan"></div><div class="barrido"></div>
    <div class="chip" id="tit">MOLÍ 3 · VISIÓN</div>
    <div class="chip" id="est">INICIANDO…</div>
    <div class="mira"></div>
    <div id="objetivo"><i></i><i></i><i></i><i></i><b>OBJETO: CARPETAS ×6</b></div>
  </div>

  <svg id="visor" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="gCasco" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#eef2f7"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
      <clipPath id="soloMarco"><path clip-rule="evenodd" d="M-20 -20H1020V620H-20Z M140 42 Q500 18 860 42 Q985 300 860 558 Q500 582 140 558 Q15 300 140 42Z"/></clipPath>
      <filter id="difu" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    <path fill="url(#gCasco)" fill-rule="evenodd" d="M-20 -20H1020V620H-20Z M140 42 Q500 18 860 42 Q985 300 860 558 Q500 582 140 558 Q15 300 140 42Z"/>
    <g clip-path="url(#soloMarco)">
      <path fill="none" stroke="#7d8aa0" stroke-width="44" opacity=".55" filter="url(#difu)" d="M140 42 Q500 18 860 42 Q985 300 860 558 Q500 582 140 558 Q15 300 140 42Z"/>
      <path fill="none" stroke="#c3ccda" stroke-width="2" vector-effect="non-scaling-stroke" d="M120 22 Q500 -4 880 22 Q1012 300 880 578 Q500 604 120 578 Q-12 300 120 22Z"/>
    </g>
    <path fill="none" stroke="#0b1438" stroke-width="9" vector-effect="non-scaling-stroke" opacity=".85" d="M140 42 Q500 18 860 42 Q985 300 860 558 Q500 582 140 558 Q15 300 140 42Z"/>
    <path id="borde" fill="none" stroke="#6ff3ff" stroke-width="3" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 4px #5fd0ff)" d="M140 42 Q500 18 860 42 Q985 300 860 558 Q500 582 140 558 Q15 300 140 42Z"/>
  </svg>

  <div class="parpado arr"></div><div class="parpado aba"></div>
  <div id="sub"></div>
  <div id="pista"></div>
  <div id="holo" role="dialog" aria-label="Mensaje">
    <div class="cab"><span>📨</span>MENSAJE NUEVO</div>
    <div class="de">De: Prof. Christian · 6.° Ciencia y Tecnología</div>
    <h2>📌 Tarea asignada:<br>Traer materiales</h2>
    <ul><li>Cartulina</li><li>Plumones</li><li>Tijeras</li><li>Goma</li><li>Regla</li><li>Lápiz</li></ul>
    <button id="ok">✔ Confirmar</button>
  </div>
</div>

<div id="inicio">
  <div class="ojos"><i></i><i></i></div>
  <h1>MOLÍ 3</h1>
  <p>Mira el mundo con los ojos de Molí 🤖</p>
  <button id="encender">▶ Encender a Molí</button>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s), B=document.body;
const esperar=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Carpetas que mira Molí ---------- */
(function cuarto(){
  const svg=$('#cuarto');
  const C=[['#ef4444','#f87171','CIENCIA'],['#f59e0b','#fbbf24','TAREAS'],['#10b981','#34d399','MISIONES'],['#3b82f6','#60a5fa','EXIT'],['#8b5cf6','#a78bfa','NOTAS'],['#ec4899','#f472b6','LAB']];
  let h=`<defs>
    <radialGradient id="pared" cx=".25" cy=".15" r="1.1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e3ecf6"/><stop offset="1" stop-color="#bccbdf"/></radialGradient>
    <linearGradient id="mesa" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f3d3ad"/><stop offset=".35" stop-color="#e2b07c"/><stop offset="1" stop-color="#b47a45"/></linearGradient>
    <linearGradient id="cajaF" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e0ea"/></linearGradient>
    <linearGradient id="vaso" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e9eef5"/><stop offset="1" stop-color="#bfc9d7"/></linearGradient>
    <linearGradient id="luzCarp" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#284066" flood-opacity=".28"/></filter>
    <filter id="desen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="suave"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#pared)"/>
  <g filter="url(#desen)" opacity=".9">
    <rect x="120" y="70" width="380" height="250" rx="22" fill="#cfe6ff"/>
    <rect x="135" y="85" width="350" height="220" rx="16" fill="#eaf5ff"/>
    <line x1="310" y1="85" x2="310" y2="305" stroke="#cfe6ff" stroke-width="10"/>
    <rect x="1130" y="100" width="300" height="200" rx="18" fill="#ffffff"/>
    <circle cx="1200" cy="170" r="34" fill="#fcd34d"/><rect x="1260" y="150" width="130" height="16" rx="8" fill="#93c5fd"/><rect x="1260" y="182" width="100" height="16" rx="8" fill="#a7f3d0"/><rect x="1170" y="230" width="220" height="16" rx="8" fill="#fbcfe8"/>
    <circle cx="760" cy="120" r="40" fill="#fff" opacity=".8"/><circle cx="900" cy="80" r="26" fill="#fff" opacity=".6"/>
  </g>
  <rect x="0" y="588" width="1600" height="312" fill="url(#mesa)"/>
  <g stroke="#fff" opacity=".12" stroke-width="3" fill="none">

/* ---------- Sonidos ---------- */
let AC, mezcla, alarmaGan, alarmaT=null;
const voz={saludo:new Audio('audio/saludo.mp3'),mensaje:new Audio('audio/mensaje.mp3'),listo:new Audio('audio/listo.mp3')};
Object.values(voz).forEach(a=>{a.preload='auto'});
function audioIni(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  mezcla=AC.createGain(); mezcla.gain.value=.9; mezcla.connect(AC.destination);
  alarmaGan=AC.createGain(); alarmaGan.gain.value=1; alarmaGan.connect(mezcla);
}
// servo robótico clásico (bzzz-iiu)
function servo(dur=.38,f0=170,f1=420,vol=.16){
  if(!AC) return; const t=AC.currentTime;
  const o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), bp=AC.createBiquadFilter();
  o.type='sawtooth'; o2.type='square';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur*.7); o.frequency.exponentialRampToValueAtTime(f1*.85,t+dur);
  o2.frequency.setValueAtTime(f0*2.01,t); o2.frequency.exponentialRampToValueAtTime(f1*2.01,t+dur*.7);
  bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=1.4;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.03); g.gain.setValueAtTime(vol,t+dur-.06); g.gain.linearRampToValueAtTime(0,t+dur);
  const g2=AC.createGain(); g2.gain.value=.3;
  o.connect(bp); o2.connect(g2); g2.connect(bp); bp.connect(g); g.connect(mezcla);
  o.start(t); o2.start(t); o.stop(t+dur+.02); o2.stop(t+dur+.02);
  clic(t+dur);
}
function clic(t){
  if(!AC) return; t=t||AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='square'; o.frequency.setValueAtTime(1800,t); o.frequency.exponentialRampToValueAtTime(300,t+.04);
  g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.06);
  o.connect(g); g.connect(mezcla); o.start(t); o.stop(t+.07);
}
function nota(f,t,d,vol,tipo='sine',dest=mezcla){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=tipo; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+d+.02);
}
// alarma suave de dos tonos
function alarma(on){
  if(!AC) return;
  clearInterval(alarmaT); alarmaT=null;
  if(!on) return;
  const ciclo=()=>{const t=AC.currentTime; nota(660,t,.32,.07,'triangle',alarmaGan); nota(880,t+.36,.32,.07,'triangle',alarmaGan)};
  ciclo(); alarmaT=setInterval(ciclo,1300);
}
function holoSon(){
  if(!AC) return; const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(1500,t+.35);
  g.gain.setValueAtTime(.0,t); g.gain.linearRampToValueAtTime(.08,t+.05); g.gain.exponentialRampToValueAtTime(.001,t+.5);
  o.connect(g); g.connect(mezcla); o.start(t); o.stop(t+.55);
  [1200,1600,2000].forEach((f,i)=>nota(f,t+.08+i*.07,.25,.03));
}
function campana(){
  if(!AC) return; const t=AC.currentTime;
  nota(880,t,.6,.12); nota(1318,t+.12,.8,.11); nota(1760,t+.24,.9,.06);
}
function hablar(k,txt){
  const a=voz[k]; $('#sub').textContent='🤖 '+txt; $('#sub').classList.add('ver');
  if(alarmaGan) alarmaGan.gain.setTargetAtTime(.35,AC.currentTime,.05);
  return new Promise(res=>{
    let hecho=false; const fin=()=>{if(hecho)return; hecho=true;
      if(alarmaGan) alarmaGan.gain.setTargetAtTime(1,AC.currentTime,.2);
      setTimeout(()=>$('#sub').classList.remove('ver'),700); res()};
    a.currentTime=0; a.onended=fin;
    a.play().catch(()=>setTimeout(fin,1800));
    setTimeout(fin,6000);
  });
}
const pista=t=>{const p=$('#pista'); if(t){p.textContent=t;p.classList.add('ver')}else p.classList.remove('ver')};
const estado=t=>$('#est').textContent=t;

/* ---------- Parpadeo ---------- */
async function parpadear(rapido){
  servo(.22,240,420,.1); B.classList.remove('abierto'); await esperar(rapido?170:260);
  servo(.26,200,460,.1); B.classList.add('abierto'); await esperar(330);
}

/* ---------- Secuencia ---------- */
let fase='apagado';
async function encender(){
  audioIni(); AC.resume&&AC.resume();
  $('#inicio').classList.add('fuera');
  await esperar(500);
  servo(.5,140,460,.16); B.classList.add('abierto'); await esperar(900);
  await parpadear(true); await esperar(250); await parpadear(true);
  B.classList.add('on'); estado('SISTEMA EN LÍNEA ✔');
  await esperar(300);
  await hablar('saludo','Saludos, usuario.');
  fase='mirando'; estado('ESCANEANDO…');
  await esperar(3200);
  alertar();
}
function alertar(){
  fase='alarma'; B.classList.add('alarma'); estado('⚠ ALERTA');
  alarma(true); pista('👆 Toca la pantalla');
}
async function subirBrazo(){
  if(fase!=='alarma') return;
  fase='brazo'; pista('');
  servo(.9,110,380,.18); B.classList.add('brazo');
  await esperar(900);
  await hablar('mensaje','Tienes un mensaje, usuario.');
  if(fase==='brazo') pista('👆 Toca la luz de mi brazo');
}
function abrirMensaje(e){
  e.stopPropagation();
  if(fase!=='brazo') return;
  fase='mensaje'; pista(''); holoSon();
  $('#holo').classList.add('ver');
}
async function confirmar(e){
  e.stopPropagation();
  if(fase!=='mensaje') return;
  fase='listo'; campana(); alarma(false);
  $('#holo').classList.remove('ver');
  B.classList.remove('alarma'); B.classList.add('ok'); estado('✔ TODO EN ORDEN');
  hablar('listo','Tarea confirmada. ¡Buen trabajo!');
  await esperar(700);
  B.classList.add('bajando'); servo(.8,380,120,.15); B.classList.remove('brazo');
  await esperar(1000);
  B.classList.remove('bajando');
  await parpadear(true);
}

$('#encender').addEventListener('click',encender);
$('#vista').addEventListener('click',subirBrazo);
$('#luz').addEventListener('click',abrirMensaje);
$('#ok').addEventListener('click',confirmar);
$('#holo').addEventListener('click',e=>e.stopPropagation());
})();
</script>
