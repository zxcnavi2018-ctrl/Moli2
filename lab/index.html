<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio de Moli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Cormorant+Garamond:ital,wght@1,700&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
body{display:flex;flex-direction:column}
.lab-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lab-top .chip{margin-left:auto}
.lab-top .help{padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--ink);font:inherit;font-weight:900;font-size:13px;cursor:pointer}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 40%,#3b82f6 60%,#1f2937 100%);animation:splashIn .5s ease-out}#splash::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(251,191,36,.08) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(59,130,246,.1) 0%,transparent 50%);pointer-events:none}
#splash.hide{animation:splashOut .6s ease-in forwards}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes splashOut{to{opacity:0;pointer-events:none}}
.splash-content{text-align:center;animation:splashScale .8s cubic-bezier(.2,1.3,.4,1) both;position:relative;z-index:2;background:rgba(15,23,42,.3);backdrop-filter:blur(8px);padding:60px 50px;border-radius:32px;border:2px solid rgba(251,191,36,.3);box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.splash-moli{font-size:clamp(60px,15vw,140px);animation:splashBounce 2s ease-in-out infinite;margin-bottom:16px}
.splash-text{background:linear-gradient(135deg,#fbbf24,#fde047,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:clamp(24px,5vw,36px);font-weight:900;margin-bottom:16px;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.splash-sub{color:rgba(255,255,255,.8);font-size:clamp(13px,2.2vw,17px);margin-bottom:28px;font-weight:700;letter-spacing:.8px}
.splash-bar{width:min(220px,75vw);height:6px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin:0 auto;border:1px solid rgba(251,191,36,.2);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.splash-bar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#fde047,#fbbf24);border-radius:99px;animation:splash-fill 1.5s ease-in-out;box-shadow:0 0 12px rgba(251,191,36,.6)}
@keyframes splashScale{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes splashBounce{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-12px) rotate(-3deg)}75%{transform:translateY(-8px) rotate(3deg)}}
@keyframes splash-fill{from{width:0}to{width:100%}}
.list{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 40px}
.grid{width:min(100%,1200px);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);column-gap:clamp(14px,2vw,22px);row-gap:clamp(30px,3.4vw,40px);perspective:900px}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:30%;position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;aspect-ratio:4/5;padding:14px;border-radius:26px;color:#fff;text-decoration:none;overflow:hidden;isolation:isolate;background:var(--g);transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease,box-shadow .25s;box-shadow:0 18px 34px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -10px 24px rgba(0,0,0,.18);animation:in .55s calc(.05s * var(--i)) cubic-bezier(.2,1.3,.4,1) both}
.card::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(120% 70% at var(--mx) var(--my),rgba(255,255,255,.35),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.card::after{content:"";position:absolute;top:-30%;left:0;width:40%;height:160%;z-index:2;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-160%) rotate(20deg);animation:shine 5.5s calc(.4s * var(--i)) ease-in-out infinite;pointer-events:none;will-change:transform}
.card:hover{box-shadow:0 26px 44px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.card:active{transform:scale(.96)}
.card:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
.card .art{position:absolute;inset:8% 6% 36% 6%;display:grid;place-items:center}
.card .art svg{position:relative;width:100%;height:100%;max-width:190px;animation:float 4s calc(.3s * var(--i)) ease-in-out infinite;will-change:transform}.card .art::after{content:"";position:absolute;left:22%;right:22%;bottom:2%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.32),transparent);pointer-events:none}
.card b{position:relative;font-size:clamp(15px,2vw,20px);font-weight:900;line-height:1.08;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.card small{position:relative;font-size:clamp(11.5px,1.4vw,13.5px);font-weight:800;opacity:.95}
.card .st{position:absolute;top:10px;right:10px;z-index:3;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.3);font-size:11.5px;font-weight:900}
.card .pg{position:relative;height:6px;margin-top:6px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.card .pg i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fff,#fde68a)}
.card.lock{filter:saturate(.3) brightness(.7);pointer-events:none}
.card.lock::after{display:none}
.dip{grid-column:1/-1;justify-self:center;width:min(100%,920px);margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:in .55s calc(.05s * var(--i)) cubic-bezier(.2,1.3,.4,1) both}
.dip-paper{position:relative;width:100%;aspect-ratio:297/210;container-type:inline-size;border-radius:clamp(8px,1.4vw,16px);overflow:hidden;box-shadow:0 0 0 1px rgba(246,220,138,.35),0 24px 50px -14px rgba(0,0,0,.75),0 0 60px rgba(251,191,36,.18)}
.dip-paper img{display:block;width:100%;height:100%}
.dip-name{position:absolute;left:24.7%;width:50.5%;top:56.8%;height:7.9%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.5cqw;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:700;font-size:var(--fs,4.6cqw);line-height:1;white-space:nowrap;background:linear-gradient(100deg,#b8892a,#f6dc8a 30%,#fff3bf 45%,#d4a83e 65%,#f2d47a 85%,#b8892a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .15cqw .15cqw rgba(0,0,0,.6))}
.dip-paper::after{content:"";position:absolute;top:-30%;left:0;width:30%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-160%) rotate(20deg);animation:shine 6s 1s ease-in-out infinite;pointer-events:none}
.dip.locked .dip-paper img{filter:saturate(.35) brightness(.5) blur(.6px)}
.dip.locked .dip-name{opacity:.35}
.dip-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;text-align:center;color:#fff;background:radial-gradient(60% 60% at 50% 50%,rgba(10,24,56,.55),rgba(10,24,56,.15))}
.dip-lock .ic{font-size:9cqw;filter:drop-shadow(0 .6cqw 1cqw rgba(0,0,0,.6));animation:float 3s ease-in-out infinite}
.dip-lock b{font-size:clamp(15px,3.2cqw,30px);font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.dip-lock small{font-size:clamp(12px,2cqw,18px);font-weight:800;color:#f6dc8a;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.dip-bar{width:min(60cqw,360px);height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;border:1px solid rgba(246,220,138,.35)}
.dip-bar i{display:block;height:100%;background:linear-gradient(90deg,#d4a83e,#fff3bf,#d4a83e);border-radius:99px}
.dip-btn{padding:13px 24px;border-radius:14px;border:1px solid #f6dc8a;background:linear-gradient(180deg,#f6dc8a,#d4a83e 55%,#a87d24);color:#1a2a55;font:inherit;font-weight:900;font-size:clamp(14px,1.6vw,17px);cursor:pointer;box-shadow:0 10px 24px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s}
.dip-btn:hover{transform:translateY(-2px)}.dip-btn:active{transform:scale(.97)}.dip-btn:disabled{opacity:.7;cursor:wait}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.9)}}
@keyframes float{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.list.scrolling .card::after,.list.scrolling .card .art svg{animation-play-state:paused}.card{contain:layout paint}
@keyframes shine{0%,70%{transform:translateX(-160%) rotate(20deg)}100%{transform:translateX(330%) rotate(20deg)}}
#help-modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);animation:fadeIn .3s ease-out}
#help-modal.open{display:flex;align-items:flex-end}
#help-modal-content{width:100%;max-height:80vh;overflow-y:auto;background:linear-gradient(135deg,#1e3a8a 0%,#1f2937 100%);border-radius:24px 24px 0 0;padding:24px 20px 40px;color:#fff;animation:slideUp .4s cubic-bezier(.2,1.3,.4,1)}
#help-modal-content h2{margin:0 0 20px;font-size:24px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.tip-item{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px;line-height:1.6}
.tip-item:last-child{border-bottom:none;margin-bottom:0}
.tip-item strong{display:block;color:#60a5fa;margin-bottom:4px;font-size:15px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (min-width:640px){#help-modal-content{max-width:480px;margin:0 auto;border-radius:20px;animation:popIn .4s cubic-bezier(.2,1.3,.4,1)}@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}}
@media (max-width:1199px){.grid{width:min(100%,1200px)}}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr);column-gap:18px;row-gap:32px}.card{padding:16px;border-radius:24px}}
@media (max-width:760px){.lab-top .w{display:none}.lab-top{gap:8px}.lab-top b{font-size:16px}.grid{grid-template-columns:repeat(2,1fr);column-gap:12px;row-gap:28px;width:min(100%,500px)}.list{padding:8px 12px 40px}.card{padding:12px;border-radius:20px;aspect-ratio:3/4}.card b{font-size:13px}.card small{font-size:10.5px}.card .st{font-size:10px;padding:2px 6px;top:6px;right:6px}.card .pg{height:5px;margin-top:4px}.card .art svg{max-width:140px}}
@media (prefers-reduced-motion:reduce){.card::after{display:none}}
@media (min-width:1200px){.grid{width:min(96vw,1760px);grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));column-gap:26px;row-gap:34px}.card{padding:20px;border-radius:30px}.card b{font-size:clamp(20px,1.5vw,28px)}.card small{font-size:clamp(14px,1vw,17px)}.card .st{font-size:13.5px;padding:5px 12px;top:14px;right:14px}.card .pg{height:8px}}</style>
</head>

 }

 return c.href?`<a class="card" href="${c.href}?u=${encodeURIComponent(U)}&t=${Date.now()}" style="--g:${c.g};--i:${i}">${inner}</a>`:`<div class="card lock" style="--g:${c.g};--i:${i}" aria-disabled="true">${inner}</div>`};

const dipBtn=document.getElementById('dip-dl');
if(dipBtn)dipBtn.onclick=async()=>{

 try{
  const img=new Image();img.src='img/diploma.jpg';await img.decode();
  await document.fonts.load('italic 700 100px "Cormorant Garamond"').catch(()=>{});
  const W=img.naturalWidth,H=img.naturalHeight,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');x.drawImage(img,0,0);
  let fs=H*.06;const font=s=>`italic 700 ${s}px "Cormorant Garamond", Georgia, serif`;x.font=font(fs);
  while(x.measureText(NAME).width>W*.48&&fs>H*.02){fs*=.95;x.font=font(fs)}
  const tw=x.measureText(NAME).width,gr=x.createLinearGradient(W/2-tw/2,0,W/2+tw/2,0);
  [[0,'#b8892a'],[.3,'#f6dc8a'],[.45,'#fff3bf'],[.65,'#d4a83e'],[.85,'#f2d47a'],[1,'#b8892a']].forEach(([o,c])=>gr.addColorStop(o,c));
  x.textAlign='center';x.textBaseline='alphabetic';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=H*.004;x.shadowOffsetY=H*.002;x.fillStyle=gr;
  x.fillText(NAME,W/2,H*.637);
  const jpg=atob(cv.toDataURL('image/jpeg',.9).split(',')[1]);
  const pdf=jpegPdf(jpg,W,H),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
  a.download='Diploma de Felicitaciones - '+(NAME.replace(/[\\/:*?"<>|]+/g,'').trim()||'Estudiante')+'.pdf';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  dipBtn.textContent='✅ ¡Diploma descargado!';setTimeout(()=>{dipBtn.textContent=t;dipBtn.disabled=false},2500);
 }catch(e){dipBtn.textContent=t;dipBtn.disabled=false;alert('No se pudo crear el diploma. Revisa tu conexión e inténtalo otra vez.')}

function jpegPdf(jpg,w,h){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const add=p=>{const b=typeof p==='string'?enc.encode(p):p;parts.push(b);len+=b.length};
 const bin=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
 const obj=(n,body)=>{offs[n]=len;add(n+' 0 obj\n');(Array.isArray(body)?body:[body]).forEach(add);add('\nendobj\n')};
 const PW=841.89,PH=595.28,cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
 add('%PDF-1.4\n');add(bin('%\xE2\xE3\xCF\xD3\n'));
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
 obj(4,[`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,bin(jpg),'\nendstream']);
 obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
 const xref=len;add('xref\n0 6\n0000000000 65535 f \n');for(let n=1;n<=5;n++)add(String(offs[n]).padStart(10,'0')+' 00000 n \n');
 add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
 return new Blob(parts);
}
