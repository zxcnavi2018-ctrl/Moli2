<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --oro: #e9c46a; --oro2: #b8862f; --tinta: #2b1a0e; --crema: #fff8ea; --vino: #8c2f39; }

  #titulo small { display: block; font: 800 clamp(10px, 1.6vw, 14px) Cinzel, serif; letter-spacing: .4em; color: #f6e2b3; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #titulo h1 { margin: 2px 0 0; font: 900 clamp(22px, 4.6vw, 50px)/1.05 "Cinzel Decorative", Cinzel, serif; color: #ffe7a3; letter-spacing: .03em;
    background: linear-gradient(180deg, #fff6cf 0%, #f3cf73 45%, #b8862f 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 3px 0 #3b2414) drop-shadow(0 8px 18px rgba(0,0,0,.55)); }

  /* ---- barra de grados ---- */
  #bar { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px; background: rgba(43,26,14,.82); border: 2px solid rgba(233,196,106,.7); box-shadow: 0 12px 30px rgba(0,0,0,.45); backdrop-filter: blur(6px); transition: opacity .6s, transform .6s; max-width: calc(100vw - 20px); }
  #bar.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #bar .g { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } #bar .g::-webkit-scrollbar { display: none; }
  #bar button { border: 0; border-radius: 999px; padding: 9px 14px; background: transparent; color: #f6e2b3; font: 800 14px Cinzel, serif; letter-spacing: .06em; white-space: nowrap; display: flex; align-items: center; gap: 6px; }

  #bar .nav { width: 42px; height: 42px; padding: 0; justify-content: center; font-size: 18px; background: rgba(233,196,106,.18); flex: none; }

  /* ---- volver ---- */
  #volver { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); z-index: 7; border: 2px solid rgba(233,196,106,.8); border-radius: 999px; padding: 8px 14px 8px 10px; background: rgba(43,26,14,.8); color: #f6e2b3; font: 800 14px Nunito, sans-serif; display: flex; align-items: center; gap: 6px; text-decoration: none; backdrop-filter: blur(6px); }

  #saltar { position: fixed; right: 16px; bottom: 18px; z-index: 7; border: 2px solid rgba(233,196,106,.7); border-radius: 999px; padding: 8px 16px; background: rgba(43,26,14,.7); color: #f6e2b3; font: 800 13px Nunito, sans-serif; transition: opacity .4s; }
  /* ---- tarjeta: libro cerrado al pasar el cursor ---- */
  #tapa { position: fixed; z-index: 8; width: 210px; pointer-events: none; opacity: 0; transform: translateY(8px) scale(.92); transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.3); }

  .cover::before { content: ''; position: absolute; inset: 8px 8px 8px 16px; border: 1.5px solid rgba(255,231,163,.75); border-radius: 3px 8px 8px 3px; pointer-events: none; }
  .cover::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 80% at 80% 0%, rgba(255,255,255,.18), transparent 55%); pointer-events: none; }
  .cover .em { font-size: 34px; margin: 6px 0 4px; text-align: center; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .cover .ti { font: 800 16px/1.2 Cinzel, serif; text-align: center; color: #ffe7a3; text-shadow: 0 2px 0 rgba(0,0,0,.3); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .cover .orn { height: 10px; margin: 8px auto; width: 60%; background: radial-gradient(circle, #f3cf73 0 2px, transparent 3px) center/12px 10px repeat-x; }
  .cover .au { margin-top: auto; text-align: center; font: 800 13px Nunito, sans-serif; color: #fff8ea; }

  .cover .th { width: 100%; height: 64px; object-fit: cover; border-radius: 6px; border: 2px solid rgba(255,231,163,.6); margin-top: 6px; }
  #tapa .hint { margin-top: 8px; text-align: center; font: 800 12px Nunito, sans-serif; color: #ffe7a3; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #tapa .abrir { display: none; margin: 8px auto 0; border: 0; border-radius: 999px; padding: 9px 16px; background: linear-gradient(180deg, #f3cf73, #b8862f); color: #2b1a0e; font: 900 14px Nunito, sans-serif; box-shadow: 0 4px 0 #6b4a1c; }
  #tapa.fijo .abrir { display: block; } #tapa.fijo .hint { display: none; }
  /* ---- libro abierto ---- */
  #libro { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(circle at 50% 40%, rgba(60,36,18,.55), rgba(10,6,3,.85)); }
  #libro.on { display: flex; animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .ab { position: relative; width: min(980px, 100%); max-height: calc(100vh - 32px); display: grid; grid-template-columns: 1fr 1fr; padding: 14px; border-radius: 14px; background: var(--c, #6b2f2f); box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 3px rgba(255,231,163,.5); perspective: 1800px; }
  .pg { position: relative; background: linear-gradient(90deg, #f7ecd4, #fff8ea 12%, #fff8ea 88%, #f0e2c4); padding: 26px 28px 22px; overflow: auto; min-height: 420px; color: #3b2414; }
  .pg.l { border-radius: 6px 0 0 6px; box-shadow: inset -18px 0 24px -14px rgba(90,60,30,.45); transform-origin: right center; animation: abrirL .9s cubic-bezier(.2,.8,.2,1); }
  .pg.r { border-radius: 0 6px 6px 0; box-shadow: inset 18px 0 24px -14px rgba(90,60,30,.45); }
  @keyframes abrirL { from { transform: rotateY(-100deg); opacity: .4; } }
  .pg::after { content: ''; position: absolute; left: 0; right: 0; bottom: 8px; height: 0; }
  .pg h2 { margin: 0 0 6px; font: 800 clamp(20px, 2.6vw, 30px)/1.15 Cinzel, serif; color: #6b2f2f; }
  .pg .cap { float: left; font: 900 64px/0.85 "Cinzel Decorative", serif; color: #b8862f; margin: 4px 8px 0 0; text-shadow: 2px 2px 0 #f3cf73; }
  .pg p { font-size: 16px; line-height: 1.55; margin: 0 0 12px; white-space: pre-wrap; }
  .pg .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .pg .meta span { padding: 4px 10px; border-radius: 999px; background: #f3e3c0; border: 1px solid #d9bd85; font-weight: 800; font-size: 13px; }
  .pg .autor { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 12px; border-top: 1.5px dashed #d9bd85; }
  .pg .autor i { width: 42px; height: 42px; border-radius: 50%; background: var(--c, #6b2f2f); color: #ffe7a3; display: grid; place-items: center; font: 900 16px Cinzel, serif; font-style: normal; }
  .pg .autor b { display: block; font-size: 16px; } .pg .autor small { color: #7a5a3a; font-weight: 700; }
  .pg img.foto { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; background: #f3e3c0; border: 2px solid #d9bd85; cursor: zoom-in; }
  .pg .ver { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 10px 16px; border-radius: 999px; background: #6b2f2f; color: #ffe7a3; font-weight: 900; text-decoration: none; }
  .pg h3.sub { clear: both; margin: 4px 0 8px; font: 800 15px Cinzel, serif; letter-spacing: .06em; color: #6b2f2f; } .pg p.fu { font-size: 14px; color: #5a4028; } .pg p.rvd { margin-top: 14px; font-weight: 800; color: #3d6b48; font-size: 14px; }
  .pg .sello { position: absolute; right: 18px; bottom: 14px; font: 800 11px Cinzel, serif; letter-spacing: .2em; color: #b8862f; opacity: .8; }
  .ab .cerrar { position: absolute; right: -10px; top: -12px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #3b2414; background: #f3cf73; color: #3b2414; font: 900 18px system-ui; box-shadow: 0 4px 0 #3b2414; z-index: 2; }
  @media (max-width: 720px) { .ab { grid-template-columns: 1fr; overflow: auto; } .pg { min-height: 0; } .pg.l { border-radius: 6px 6px 0 0; transform-origin: center top; } .pg.r { border-radius: 0 0 6px 6px; } @keyframes abrirL { from { transform: rotateX(80deg); } } }
  /* ---- cargando ---- */
  #carga { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #5a3a1e, #1c0f06); color: #f6e2b3; transition: opacity .8s; }
  #carga div { text-align: center; font: 800 16px Cinzel, serif; letter-spacing: .2em; }
  #carga span { display: block; font-size: 46px; margin-bottom: 10px; animation: flot 1.6s ease-in-out infinite; }
  @keyframes flot { 50% { transform: translateY(-10px) rotate(-4deg); } }
  #aviso { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 6; padding: 10px 18px; border-radius: 999px; background: rgba(43,26,14,.86); border: 2px solid rgba(233,196,106,.7); color: #f6e2b3; font: 800 14px Nunito, sans-serif; text-align: center; opacity: 0; transition: opacity .4s; pointer-events: none; max-width: calc(100vw - 24px); }
  #aviso.on { opacity: 1; }
  @media (max-width: 600px) { #titulo { top: 62px; } }
  @media (max-width: 600px) { #bar button { padding: 8px 10px; font-size: 12px; } #bar .nav { width: 36px; height: 36px; } #tapa { width: 170px; } }
</style>
</head>
<body>
<div id="carga"><div><span>📖</span>Abriendo la biblioteca…</div></div>
<a id="volver" href="index.html">← Volver al aula</a>

<div id="titulo"><small>INNOVA SCHOOLS · CIENCIA Y TECNOLOGÍA</small><h1>La Biblioteca Educativa</h1><span class="orla"></span></div>
<div id="escena"><div><small>ESCENA</small><b></b></div></div>
<div id="bar"><button class="nav" type="button" data-nav="-1" aria-label="Estante anterior">◀</button><div class="g"></div><button class="nav" type="button" data-nav="1" aria-label="Estante siguiente">▶</button><button class="todo" type="button" data-todo="1">🏛️ Toda</button></div>
<button id="saltar" type="button">Saltar ⏭</button>
<div id="tapa"></div>
<div id="aviso"></div>
<div id="libro"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
// ===================================================================
//  LA BIBLIOTECA EDUCATIVA
//   · Al entrar: el libro mágico del atril se abre y la cámara se aleja para mostrar toda la biblioteca.
//   · 6 estantes: Sexto y Séptimo (izquierda), Octavo y Noveno (derecha), Décimo y Undécimo (al fondo).
//   · Cada trabajo aprobado en la Revista Innovadora aparece solo como un libro en el estante de su grado.
// ===================================================================
const FB = { apiKey: 'AIzaSyB3IlHEFGkCGtZhPZxV5-a47Pg2mAaIjSM', projectId: 'ciencia6abcd' };
const BASE = `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const QS = new URLSearchParams(location.search);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const isTouch = matchMedia('(pointer: coarse)').matches;
const LOW = isTouch || /[?&]low/.test(location.search);

// ---- los 6 estantes (como en el dibujo de la profe) ----
const GRADOS = [
  { g: 6, n: 'SEXTO', t: 'Sexto grado', x: -6.35, z: 1.8, ry: Math.PI / 2, c: 0x8c2f39 },
  { g: 7, n: 'SÉPTIMO', t: 'Séptimo grado', x: -6.35, z: -4.8, ry: Math.PI / 2, c: 0x2f5d8c },
  { g: 8, n: 'OCTAVO', t: 'Octavo grado', x: 6.35, z: -4.8, ry: -Math.PI / 2, c: 0x3d7a4a },
  { g: 9, n: 'NOVENO', t: 'Noveno grado', x: 6.35, z: 1.8, ry: -Math.PI / 2, c: 0x6b4a8c },
  { g: 10, n: 'DÉCIMO', t: 'Décimo grado', x: -3.3, z: -15.35, ry: 0, c: 0x9a5b22 },
  { g: 11, n: 'UNDÉCIMO', t: 'Undécimo grado', x: 5.0, y: 4.66, z: -15.35, ry: 0, c: 0x1f6f78 }];
const COL_SEC = { A: '#6b2a2f', B: '#2c4a6e', C: '#35603f', D: '#7d4d22', E: '#55406e', F: '#235a60' };
const TIPOS = { inv: ['🔬', 'Investigación'], pro: ['🛠️', 'Producto'], maq: ['🧩', 'Maqueta'], info: ['🖼️', 'Infografía'], vid: ['🎬', 'Video'], exp: ['⚗️', 'Experimento'] };

// ===================================================================
//  ESCENA
// ===================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e130b);
scene.fog = new THREE.Fog(0x2a1a0f, 16, 40);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.05, 120);
const renderer = new THREE.WebGLRenderer({ antialias: !LOW, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.25 : 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xf2dcb4, 0x3b2414, 0.46));
scene.add(new THREE.AmbientLight(0xd9b98a, 0.16));
const key = new THREE.DirectionalLight(0xffe2b0, 0.36); key.position.set(-4, 12, 8); scene.add(key);
const glowLight = new THREE.PointLight(0xffd27a, 0, 9, 1.6); glowLight.position.set(0, 3.3, 0.5); scene.add(glowLight);
const lampA = new THREE.PointLight(0xffb866, 0.95, 16, 1.6); lampA.position.set(0, 6.6, 3.5); scene.add(lampA);
const lampB = new THREE.PointLight(0xffb866, 0.8, 16, 1.6); lampB.position.set(0, 6.6, -9); scene.add(lampB);

const TOON_GRAD = (() => { const t = new THREE.DataTexture(new Uint8Array([120, 190, 245]), 3, 1, THREE.LuminanceFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();
const toon = (color, o = {}) => new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: TOON_GRAD }, o));
const INK = new THREE.MeshBasicMaterial({ color: 0x2b1a0e, side: THREE.BackSide });
INK.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `vec4 wp = modelMatrix * vec4(transformed, 1.0); vec3 dir = normalize(mat3(modelMatrix) * normal); float dd = max(0.1, -(viewMatrix * wp).z); wp.xyz += dir * (0.003 + dd * 0.0022); vec4 mvPosition = viewMatrix * wp; gl_Position = projectionMatrix * mvPosition;`); };
const ink = m => { if (!LOW) m.add(new THREE.Mesh(m.geometry, INK)); return m; };
const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent, outline = true) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); if (outline) ink(m); if (parent) parent.add(m); return m; };
function canvasTex(w, h, draw, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// ---- maderas y dorados (colores suaves) ----
const MAD = toon(0x6e4324), MAD_OSC = toon(0x432614), MAD_CLARA = toon(0x8f6236), ORO = toon(0x9c7a3c), CREMA = toon(0xf3e3c4);
const PARQUET = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#6e4a2a'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const v = 0.85 + rnd() * 0.25; g.fillStyle = `rgb(${120 * v | 0},${80 * v | 0},${46 * v | 0})`;
    if ((x + y) % 2) g.fillRect(x * 64 + 2, y * 64 + 2, 60, 28), g.fillRect(x * 64 + 2, y * 64 + 34, 60, 28); else g.fillRect(x * 64 + 2, y * 64 + 2, 28, 60), g.fillRect(x * 64 + 34, y * 64 + 2, 28, 60); }
  g.globalAlpha = .08; for (let i = 0; i < 300; i++) { g.fillStyle = rnd() < .5 ? '#000' : '#fff'; g.fillRect(rnd() * w, rnd() * h, rnd() * 40, 1); } }, [10, 18]);
const ALFOMBRA = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#5e1f27'; g.fillRect(0, 0, w, h); g.strokeStyle = '#a8843f'; g.lineWidth = 8; g.strokeRect(16, -10, w - 32, h + 20); g.lineWidth = 2; g.strokeRect(30, -10, w - 60, h + 20);
  g.fillStyle = 'rgba(224,180,90,.45)'; for (let y = 32; y < h; y += 64) { g.beginPath(); g.moveTo(w / 2, y - 18); g.lineTo(w / 2 + 18, y); g.lineTo(w / 2, y + 18); g.lineTo(w / 2 - 18, y); g.fill(); } }, [1, 6]);

// ===================================================================
//  LA SALA: piso, alfombra, paredes, galería y bóveda pintada
// ===================================================================
const HALL = { x: 7, z0: 10, z1: -16 };
const piso = new THREE.Mesh(new THREE.PlaneGeometry(HALL.x * 2, HALL.z0 - HALL.z1), toon(0xffffff, { map: PARQUET }));
piso.rotation.x = -Math.PI / 2; piso.position.z = (HALL.z0 + HALL.z1) / 2; scene.add(piso);
const alf = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 24), toon(0xffffff, { map: ALFOMBRA })); alf.rotation.x = -Math.PI / 2; alf.position.set(0, 0.012, -3); scene.add(alf);
// paredes de fondo (detrás de los estantes) y pared del fondo
const PARED = toon(0x4a2c18);

      <div class="autor"><i>${esc(String(t.n || '?').split(' ').slice(0, 2).map(x => x[0] || '').join(''))}</i><div><b>${esc(t.n || '')}</b><small>6.° ${esc(t.sec || '')}${fecha ? ' · ' + esc(fecha) : ''}</small></div></div></div>
    <div class="pg r"><h3 class="sub">📝 De qué trata</h3>${d ? `<span class="cap">${esc(d[0])}</span><p>${esc(d.slice(1))}</p>` : '<p>Este trabajo no trae descripción.</p>'}
      ${t.f ? `<h3 class="sub">📚 Fuentes que usó</h3><p class="fu">${esc(t.f)}</p>` : ''}${safeUrl(t.link) ? `<a class="ver" href="${esc(safeUrl(t.link))}" target="_blank" rel="noopener">🔗 Ver el trabajo completo</a>` : ''}
      ${t.rv ? `<p class="rvd">✔ Revisado por ${esc(t.rv)}</p>` : ''}<span class="sello">REVISTA INNOVADORA ✦ APROBADO</span></div></div>`;
  L.classList.add('on');
  if (!t.img && t.id && !String(t.id).startsWith('demo')) fetch(`${BASE}/revista/${encodeURIComponent(t.id)}?key=${FB.apiKey}`).then(r => r.ok ? r.json() : null).then(j => { const v = j && j.fields && j.fields.img && j.fields.img.stringValue; if (v) { t.img = v; const im = L.querySelector('img.foto'); if (im) im.src = v; } }).catch(() => {});
}
const safeUrl = u => { try { const x = new URL(String(u || '')); return x.protocol === 'https:' ? x.href : ''; } catch (e) { return ''; } };
function cerrarLibro() { $('#libro').classList.remove('on'); sonar('cerrar'); }
$('#libro').addEventListener('click', e => { if (e.target.id === 'libro' || e.target.closest('.cerrar')) cerrarLibro(); else if (e.target.matches('img.foto')) window.open(e.target.src, '_blank'); });

// ---- avisos y sonidos suaves ----
let avT = 0; function aviso(txt, s = 3) { const a = $('#aviso'); a.textContent = txt; a.classList.add('on'); clearTimeout(avT); avT = setTimeout(() => a.classList.remove('on'), s * 1000); }
let AC = null, mudo = false; try { mudo = localStorage.getItem('moli2:bibmudo') === '1'; } catch (e) {} $('#sonido').textContent = mudo ? '🔇' : '🔊';
$('#sonido').onclick = () => { mudo = !mudo; $('#sonido').textContent = mudo ? '🔇' : '🔊'; try { localStorage.setItem('moli2:bibmudo', mudo ? '1' : '0'); } catch (e) {} };
function sonar(k) { if (mudo) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime;
  const nota = (f, d, at, tipo = 'sine', v = 0.06) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(0, t + at); g.gain.linearRampToValueAtTime(v, t + at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + at + d); o.connect(g).connect(AC.destination); o.start(t + at); o.stop(t + at + d + 0.05); };
  if (k === 'magia') [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => nota(f, 0.9, i * 0.09, 'triangle', 0.05));
  else if (k === 'pasar') { nota(392, 0.4, 0, 'sine', 0.04); nota(587, 0.5, 0.08, 'sine', 0.035); }
  else if (k === 'abrir') { nota(660, 0.25, 0, 'triangle', 0.05); nota(990, 0.35, 0.06, 'triangle', 0.04); }
  else if (k === 'cerrar') nota(440, 0.2, 0, 'triangle', 0.04);
  else if (k === 'tic') nota(1200, 0.06, 0, 'sine', 0.02); } catch (e) {} }

// ===================================================================
//  BUCLE
// ===================================================================
const clock = new THREE.Clock(); let par = V(0, 0, 0), zoomS = 0; const _dir = V(0, 0, 0), LIBRO_POS = V(0, 2.5, 0);
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), now = performance.now(), T = clock.elapsedTime;
  if (tween) { const k = Math.min(1, (now - tween.t0) / tween.ms), e = ease(k);
    cam.pos.lerpVectors(tween.p0, tween.p1, e); cam.pos.y += Math.sin(Math.PI * e) * tween.alto; cam.look.lerpVectors(tween.l0, tween.l1, e);
    if (k >= 1) { const r = tween.res; tween = null; r(); } }
  // un poquito de paralaje con el mouse (vida)
  const tx = modo === 'intro' ? 0 : (px / innerWidth - 0.5) * 0.35, ty = modo === 'intro' ? 0 : (py / innerHeight - 0.5) * 0.2; par.x += (tx - par.x) * 0.04; par.y += (ty - par.y) * 0.04;
  const resp = modo === 'sala' && !tween ? (1 - Math.cos(T * 0.35)) * 0.5 : 0; zoomS += (resp - zoomS) * (1 - Math.exp(-dt * 2));   // «respira»: se acerca un poquito al libro y vuelve
  _dir.subVectors(LIBRO_POS, cam.pos).multiplyScalar(zoomS * 0.22);
  camera.position.set(cam.pos.x + par.x + _dir.x, cam.pos.y - par.y + _dir.y, cam.pos.z + _dir.z); camera.lookAt(cam.look);
  // libros que salen un poquito al pasar el cursor
  ESTANTES.forEach(E => { E.halo.material.opacity += ((E.haloT || 0) * 0.8 - E.halo.material.opacity) * (1 - Math.exp(-dt * 4)); const eo = modo === 'sala' ? 1 : 0; E.et.material.opacity += (eo - E.et.material.opacity) * (1 - Math.exp(-dt * 7)); E.et.visible = E.et.material.opacity > 0.02; E.et.position.y = 3.0 + Math.sin(T * 1.3 + E.g) * 0.06;
    E.hit.forEach(b => { const want = (b === hover || b === fijo) ? 0.2 : 0; b.userData.sal += (want - b.userData.sal) * 0.25; b.position.z = b.userData.x0 + b.userData.sal; b.rotation.y = b.userData.sal * -0.3; }); });
  // chispitas del libro mágico
  if (chispear > 0) for (let i = 0; i < NCH; i++) { const c = chVel[i]; if (c.life <= 0 || c.t > c.life) { if (Math.random() < chispear * 0.08) soltarChispa(i); else { chPos[i * 3 + 1] = -99; c.life = 0; } continue; }
    c.t += dt; chPos[i * 3] += c.v.x * dt; chPos[i * 3 + 1] += c.v.y * dt; chPos[i * 3 + 2] += c.v.z * dt; c.v.multiplyScalar(0.985); }
  chGeo.attributes.position.needsUpdate = true;
  for (let i = 0; i < NP; i++) { pPos[i * 3 + 1] += Math.sin(T * 0.3 + i) * 0.0015 + 0.002; if (pPos[i * 3 + 1] > 9) pPos[i * 3 + 1] = 0.2; } pGeo.attributes.position.needsUpdate = true;
  brillo.scale.setScalar(3.6 + Math.sin(T * 2) * 0.2); aranas.forEach((a, i) => a.rotation.y = Math.sin(T * 0.4 + i) * 0.05);
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 72 : 58; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
dispatchEvent(new Event('resize'));
window.BIB = { ESTANTES, irEstante, irSala, abrirLibro, get modo() { return modo; }, camera, scene };
const listo = document.fonts ? document.fonts.ready.catch(() => {}) : Promise.resolve();
Promise.race([listo, wait(2500)]).then(() => { ESTANTES.forEach(E => E.m.children.filter(c => c.material && c.material.map && c.geometry.type === 'PlaneGeometry' && c.position.y > 4).forEach(c => { c.material.map = placaTex(E.n, 'GRADO', E.c); })); ESTANTES.forEach(E => { E.et.material.map = etiquetaTex(E.n); }); cargarTrabajos(); requestAnimationFrame(frame); intro(); });
})();
