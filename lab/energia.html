<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Energía cinética y potencial · Laboratorio de Moli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
body{display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#1e3a8a,#0b1033 70%)}
.main{flex:1;min-height:0;overflow:auto;width:min(100%,1040px);margin:0 auto;padding:0 10px 14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;align-content:start}
.park{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 16px 34px rgba(0,0,0,.45);touch-action:none}
.park svg{display:block;width:100%;height:auto}
.hud{position:absolute;left:10px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
.hud span{padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.45);font-weight:900;font-size:13px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ctl button{flex:1 1 auto;padding:10px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:900;font-size:13.5px;cursor:pointer}
.ctl button.on{background:linear-gradient(135deg,#f97316,#dc2626);border-color:#fdba74}
.ctl button.go{background:linear-gradient(135deg,#22c55e,#15803d);border-color:#86efac}
.ctl button.rt{background:linear-gradient(135deg,#a855f7,#6d28d9);border-color:#d8b4fe}
.side{display:flex;flex-direction:column;gap:8px}
.box{padding:12px;border-radius:18px;background:rgba(15,23,60,.9);border:1px solid rgba(255,255,255,.14)}
.box h3{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#a9b8de}
.bar{margin-bottom:8px}
.bar div{display:flex;justify-content:space-between;font-weight:900;font-size:13px;margin-bottom:3px}
.bar i{display:block;height:16px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i b{display:block;height:100%;width:0;border-radius:99px;transition:width .08s linear}
.bp b{background:linear-gradient(90deg,#60a5fa,#2563eb)}.bc b{background:linear-gradient(90deg,#fb923c,#dc2626)}.bh b{background:linear-gradient(90deg,#fde047,#f97316)}.bt b{background:linear-gradient(90deg,#4ade80,#16a34a)}
.why{padding:12px;border-radius:18px;background:#fff;color:#14224a;font-weight:700;font-size:14px;line-height:1.45;min-height:84px}
.why b.k{color:#2563eb}.why b.c{color:#dc2626}
.pred{padding:12px;border-radius:18px;background:#fff;color:#14224a;animation:up .35s cubic-bezier(.2,1.3,.4,1)}
.pred h3{margin:0 0 8px;font-size:16px}
.pred .ops{display:flex;flex-direction:column;gap:6px}
.pred .ops button{padding:10px 12px;border-radius:12px;border:2px solid #e2e8f0;background:#f8fafc;color:#14224a;font:inherit;font-weight:900;font-size:14.5px;text-align:left;cursor:pointer}
.pred .ops button.sel{border-color:#7c3aed;background:#ede9fe}
.pred .ops button.ok{border-color:#16a34a;background:#dcfce7}.pred .ops button.no{border-color:#dc2626;background:#fee2e2}
.pred p{margin:8px 0 0;font-weight:700;font-size:14px;line-height:1.4}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.mis .mi{font-size:12.5px;padding:8px 10px}
.moli-say{left:auto;right:8px;top:8px;bottom:auto;flex-direction:row-reverse;align-items:flex-start;max-width:min(420px,calc(100% - 16px))}
.moli-say img{width:46px}
.moli-say p{margin:40px 0 0;border-radius:16px 4px 16px 16px;font-size:13.5px}
.moli-say::after{left:auto;right:34px;bottom:auto;top:30px}
.lab-top{padding-right:62px}
@media (max-width:820px){.main{grid-template-columns:1fr}.ctl button{font-size:12.5px;padding:9px 6px}}
</style>
</head>
<body>
<header class="lab-top"><a class="back" id="back" href="index.html">‹ Laboratorio</a><b>🛹 Energía cinética y potencial</b></header>
<div class="main">
  <div>
    <div class="park" id="park"><svg id="sv" viewBox="0 0 1000 520"></svg><div class="hud"><span id="hH">📏 Altura: 0 m</span><span id="hV">💨 Rapidez: 0 m/s</span></div></div>
    <div class="ctl"><button type="button" id="fr">🧽 Sin fricción</button><button type="button" id="ms">🧒 Niño · 30 kg</button><button type="button" class="rt" id="rt">🎯 Reto: predice</button><button type="button" id="rs">🔄 Al centro</button></div>
  </div>
  <aside class="side">
    <div class="why" id="why">👆 <b>Arrastra al skater</b> hacia arriba por la rampa y <b>suéltalo</b>. Mira cómo cambian las barras de energía.</div>
    <div id="pred"></div>
    <div class="box"><h3>⚡ Energía</h3>
      <div class="bar bp"><div><span>🔋 Potencial (altura)</span><span id="vP">0 J</span></div><i><b id="bP"></b></i></div>
      <div class="bar bc"><div><span>💨 Cinética (movimiento)</span><span id="vC">0 J</span></div><i><b id="bC"></b></i></div>
      <div class="bar bh"><div><span>🔥 Calor (fricción)</span><span id="vH">0 J</span></div><i><b id="bH"></b></i></div>
      <div class="bar bt"><div><span>✨ Energía total</span><span id="vT">0 J</span></div><i><b id="bT"></b></i></div>
    </div>
    <div class="mis" id="mis"></div>
  </aside>
</div>
<div class="moli-say"><img src="../guia/img/moli.webp" alt=""><p id="say"></p></div>
<script>
(()=>{
const U=new URLSearchParams(location.search).get('u')||'anon';
document.getElementById('back').href='index.html?u='+encodeURIComponent(U);
const KEY='lab:'+U+':cin',load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const $=id=>document.getElementById(id),say=$('say'),sv=$('sv');let MI=load(KEY,{});
// ---------- la pista: una rampa en U de 10 m de alto ----------
const G=9.8,HM=10,XM=12.22,PX=36,CX=500,BY=440;
const h=X=>HM*(X/XM)**2,dh=X=>2*HM*X/XM/XM;
const toS=(X,H)=>[CX+X*PX,BY-H*PX];
const MASS=[[30,'🧒','Niño · 30 kg'],[60,'🧑','Joven · 60 kg']];
let mi=0,fric=0,X=0,v=0,run=0,drag=0,E0=0,heat=0,rest=0,low=0,peakX=null,dir=0,trail=[],ch=null,wasTop=0;
const m=()=>MASS[mi][0],Emax=()=>m()*G*HM;
// ---------- dibujo fijo ----------
let track='';for(let X=-XM;X<=XM+.01;X+=.2){const[a,b]=toS(X,h(X));track+=(X===-XM?'M':'L')+a.toFixed(1)+' '+b.toFixed(1)}
const BG=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#bae6fd"/></linearGradient></defs>
<rect width="1000" height="520" fill="url(#sky)"/><circle cx="880" cy="70" r="38" fill="#fde047" opacity=".9"/>
<path d="M0 420 Q150 360 300 410 T620 400 T1000 390 V520 H0Z" fill="#86efac"/><rect y="470" width="1000" height="50" fill="#64748b"/>
${Array.from({length:11},(_,i)=>{const y=BY-i*PX;return `<path d="M24 ${y}h14" stroke="#1e3a8a" stroke-width="2"/><text x="44" y="${y+4}" font-size="11" font-weight="900" fill="#1e3a8a">${i} m</text>`}).join('')}
<path d="M30 ${BY}V${BY-HM*PX}" stroke="#1e3a8a" stroke-width="3"/>
${[-11,-8,-5,5,8,11].map(X=>{const[a,b]=toS(X,h(X));return `<path d="M${a} ${b+6}V470" stroke="#92400e" stroke-width="7"/>`}).join('')}
<path d="${track} L${CX+XM*PX} 470 L${CX-XM*PX} 470Z" fill="rgba(146,64,14,.25)"/>
<path d="${track}" stroke="#78350f" stroke-width="16" fill="none" stroke-linecap="round"/><path d="${track}" stroke="#f59e0b" stroke-width="9" fill="none" stroke-linecap="round"/>`;
function draw(){const H=h(X),[sx,sy]=toS(X,H),ang=-Math.atan(dh(X))*180/Math.PI,sp=Math.abs(v);let s=BG;
 if(ch){const[a,b]=toS(-XM,ch.h0),[c]=toS(XM,ch.h0);s+=`<path d="M${a} ${b}H${c}" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 8"/><text x="${c-4}" y="${b-8}" font-size="14" font-weight="900" fill="#6d28d9" text-anchor="end">altura de salida</text>`;
  if(ch.peak!=null){const[px,py]=toS(ch.side*Math.sqrt(ch.peak/HM)*XM,ch.peak);s+=`<text x="${px}" y="${py-14}" font-size="28" text-anchor="middle">🚩</text>`}}
 trail.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${2+i*.25}" fill="#fff" opacity="${(i/trail.length*.6).toFixed(2)}"/>`});
 if(fric&&sp>1)for(let i=0;i<3;i++)s+=`<circle cx="${sx-Math.sign(v)*(10+i*8)}" cy="${sy+6-i*3}" r="${3+i}" fill="#f97316" opacity="${.5-i*.12}"/>`;
 const K=innerWidth<600?1.7:1;s+=`<g transform="translate(${sx} ${sy}) rotate(${ang}) scale(${K})"><text y="-6" font-size="30" text-anchor="middle">🛹</text><text y="-30" font-size="${mi?44:36}" text-anchor="middle">${MASS[mi][1]}</text>${drag?'<circle r="46" cy="-28" fill="none" stroke="#fde047" stroke-width="4" stroke-dasharray="6 6"/>':''}</g>`;
 if(sp>6)s+=`<g transform="translate(${sx} ${sy-30})" opacity=".7"><path d="M${-Math.sign(v)*30} -10h${-Math.sign(v)*26}M${-Math.sign(v)*34} 2h${-Math.sign(v)*30}M${-Math.sign(v)*30} 14h${-Math.sign(v)*22}" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>`;
 sv.innerHTML=s}
// ---------- energía y textos ----------
function bars(){const H=h(X),Ep=m()*G*H,Ec=.5*m()*v*v,T=Math.max(E0,Ep+Ec),Q=fric?Math.max(0,E0-Ep-Ec):0,M=Emax();
 [['P',Ep],['C',Ec],['H',Q],['T',fric?E0:Ep+Ec]].forEach(([k,val])=>{$('b'+k).style.width=Math.min(100,val/M*100)+'%';$('v'+k).textContent=Math.round(val).toLocaleString('es-PE')+' J'});
 $('hH').textContent=`📏 Altura: ${H.toFixed(1)} m`;$('hV').textContent=`💨 Rapidez: ${Math.abs(v).toFixed(1)} m/s`;
 if(drag)return why(`Arriba, a <b>${H.toFixed(1)} m</b>, el skater tiene mucha <b class="k">energía potencial</b> (energía guardada por la altura). ¡Suéltalo!`);
 if(!run)return;const goingDown=v*X<0;
 if(Math.abs(X)<.6)why('⬇️ ¡Abajo! Aquí la altura es mínima: casi toda la energía es <b class="c">cinética</b>. ¡Va lo más rápido posible!');
 else if(goingDown)why('La <b class="k">energía potencial</b> se está <b>transformando</b> en <b class="c">energía cinética</b>: baja y va cada vez más rápido.');
 else why('Ahora sube: la <b class="c">energía cinética</b> vuelve a ser <b class="k">potencial</b>, por eso va más lento.'+(fric?' Una parte se pierde como <b>calor</b> por la fricción 🔥.':''))}
let lastWhy='';function why(t){if(t!==lastWhy){lastWhy=t;$('why').innerHTML=t}}
// ---------- simulación ----------
let t0=performance.now();
function loop(now){const dt=Math.min(.033,(now-t0)/1000);t0=now;
 if(run&&!drag){const n=6,d=dt/n;for(let i=0;i<n;i++){const s=dh(X),c=1/Math.sqrt(1+s*s);let a=-G*s*c;if(fric&&Math.abs(v)>.02)a-=.16*G*c*Math.sign(v);
   const pv=v;v+=a*d;X+=v*c*d;
   if(!fric){const E=E0/m()/G,k=Math.max(0,2*G*(E-h(X)));v=Math.sign(v||pv||1)*Math.sqrt(k)}
   if(Math.abs(X)>XM){X=Math.sign(X)*XM;v=0}
   if(pv!==0&&Math.sign(v)!==Math.sign(pv)){turn()}}
  const[sx,sy]=toS(X,h(X));trail.push([sx,sy-28]);if(trail.length>14)trail.shift();
  if(Math.abs(v)>12&&Math.abs(X)<.8&&!MI.ec){win('ec','¡Pasó abajo a toda velocidad! En el punto más bajo la energía cinética es máxima.')}
  if(fric&&Math.abs(v)<.35&&Math.abs(dh(X))<.16){rest+=dt;v*=.6;if(rest>.4){run=0;v=0;why('🛑 Se detuvo. Toda su energía se transformó en <b>calor</b> por la fricción con el piso y el aire. ¡La energía no desaparece: se transforma!');if(!MI.fri)win('fri','Con fricción, la energía se transformó en calor hasta detenerse.')}}else rest=0;
  if(Math.abs(v)>2)whoosh(Math.abs(v))}
 else trail=[];
 draw();bars();requestAnimationFrame(loop)}
function turn(){if(!ch||ch.peak!=null)return;if(Math.sign(X)!==ch.side)return;ch.peak=h(X);check()}
// ---------- arrastrar ----------
const P=e=>{const q=sv.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(sv.getScreenCTM().inverse())};
sv.addEventListener('pointerdown',e=>{actx();const p=P(e),[sx,sy]=toS(X,h(X));const K=innerWidth<600?1.7:1;if(Math.hypot(p.x-sx,p.y-(sy-30*K))>80*K)return;if(ch&&ch.sel==null)return void(say.innerHTML='🎯 Primero elige tu <b>predicción</b> y luego toca <b>Soltar</b>.');if(ch)return;drag=1;run=0;v=0;sv.setPointerCapture(e.pointerId);e.preventDefault()});
sv.addEventListener('pointermove',e=>{if(!drag)return;const p=P(e);X=Math.max(-XM*.985,Math.min(XM*.985,(p.x-CX)/PX))});
const up=()=>{if(!drag)return;drag=0;start();if(h(X)>=9&&!MI.ep)win('ep','¡Lo subiste a lo más alto! Allí la energía potencial es máxima.')};
sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
function start(){E0=m()*G*h(X);heat=0;v=0;run=E0>1;rest=0;if(run){pop();say.innerHTML=h(X)>6?'¡Allá va! 🛹 Mira las barras: la potencial baja y la cinética sube.':'Súbelo más alto para que tenga más energía. ⬆️'}}
// ---------- botones ----------
$('fr').onclick=()=>{fric=!fric;$('fr').classList.toggle('on',fric);$('fr').textContent=fric?'🔥 Con fricción':'🧽 Sin fricción';if(run)E0=m()*G*h(X)+.5*m()*v*v;say.innerHTML=fric?'🔥 Ahora hay <b>fricción</b>: el roce de las ruedas convierte parte de la energía en <b>calor</b>.':'🧽 Sin fricción, la energía total <b>se conserva</b>: sube siempre a la misma altura.';click()};
$('ms').onclick=()=>{mi=1-mi;$('ms').textContent=MASS[mi][1]+' '+MASS[mi][2];if(run){E0=m()*G*h(X)+.5*m()*v*v}say.innerHTML=`${MASS[mi][1]} Con más masa, la <b>energía es mayor</b> (mira los números), pero… ¿va más rápido? ¡Fíjate en la rapidez!`;click()};
$('rs').onclick=()=>{ch=null;$('pred').innerHTML='';run=0;X=0;v=0;E0=0;why('👆 <b>Arrastra al skater</b> hacia arriba por la rampa y <b>suéltalo</b>.');click()};
$('rt').onclick=challenge;
function challenge(){actx();run=0;v=0;const side=Math.random()<.5?-1:1,h0=5+Math.random()*3.5;X=-side*XM*Math.sqrt(h0/HM);E0=m()*G*h0;
 const f=Math.random()<.5;fric=f;$('fr').classList.toggle('on',f);$('fr').textContent=f?'🔥 Con fricción':'🧽 Sin fricción';
 ch={side,h0,f,peak:null,sel:null,ok:f?'menos':'igual'};click();
 $('pred').innerHTML=`<div class="pred"><h3>🎯 Reto ${f?'con fricción 🔥':'sin fricción 🧽'}: si suelto al skater desde aquí, ¿hasta qué altura llegará al otro lado?</h3><div class="ops"><button type="button" data-k="mas">⬆️ Más alto que donde salió</button><button type="button" data-k="igual">↔️ A la misma altura</button><button type="button" data-k="menos">⬇️ Más bajo que donde salió</button></div><div id="pr"></div></div>`;
 $('pred').querySelectorAll('.ops button').forEach(b=>b.onclick=()=>{if(ch.peak!=null||run)return;ch.sel=b.dataset.k;$('pred').querySelectorAll('.ops button').forEach(x=>x.classList.toggle('sel',x===b));$('pr').innerHTML='<button type="button" class="go" id="go" style="margin-top:8px;width:100%;padding:11px;border-radius:12px;border:0;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font:inherit;font-weight:900;font-size:15px;cursor:pointer">▶ Soltar al skater</button>';$('go').onclick=()=>{$('go').remove();start()};click()});
 say.innerHTML='🎯 <b>Piensa antes de soltar</b>: elige tu predicción. La línea morada marca la altura de salida.';why('🤔 ¿La energía potencial de arriba alcanzará para subir igual de alto al otro lado?')}
function check(){const r=ch.f?'menos':'igual',ok=ch.sel===r;const btns=$('pred').querySelectorAll('.ops button');btns.forEach(b=>{if(b.dataset.k===r)b.classList.add('ok');else if(b.dataset.k===ch.sel)b.classList.add('no')});
 $('pr').innerHTML=`<p>${ok?'✅ ¡Acertaste!':'❌ No era esa.'} ${ch.f?'Con <b>fricción</b>, parte de la energía se transforma en <b>calor</b>, así que <b>no alcanza</b> para subir tan alto.':'Sin fricción la energía total <b>se conserva</b>: toda la cinética vuelve a ser potencial y sube <b>a la misma altura</b>.'}</p><button type="button" id="again" style="margin-top:8px;width:100%;padding:10px;border-radius:12px;border:0;background:linear-gradient(135deg,#a855f7,#6d28d9);color:#fff;font:inherit;font-weight:900;font-size:14.5px;cursor:pointer">🎯 Otro reto</button>`;
 $('again').onclick=challenge;ok?fanfare(1):boing();if(ok&&!MI.pre)win('pre','Predijiste bien hasta dónde llegaría el skater.')}
function win(k,t){MI[k]=1;save(KEY,MI);mis();fanfare();say.innerHTML='🎉 <b>¡Misión cumplida!</b> '+t}
function mis(){$('mis').innerHTML=`<h3>🎯 Misiones</h3>${[['ep','Súbelo a lo más alto (potencial máxima)'],['ec','Pasa abajo a toda velocidad (cinética máxima)'],['pre','Acierta un reto de predicción'],['fri','Con fricción: mira cómo se detiene']].map(([k,t])=>`<div class="mi ${MI[k]?'ok':''}">${t}<em>${MI[k]?'Completado ✅':'Falta'}</em></div>`).join('')}`}
// ---------- sonidos ----------
let ac=null,lw=0;const actx=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.state!=='running'&&ac.resume()}catch(e){}return ac};
function tone(f,d,ty,v=.06,t0=0){const a=actx();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}
function whoosh(sp){const now=performance.now();if(now-lw<180)return;lw=now;const a=actx();if(!a||!run)return;const t=a.currentTime,n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*.18,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/c.length);n.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=300+sp*60;f.Q.value=1.2;const g=a.createGain();g.gain.value=Math.min(.1,sp/150);n.connect(f).connect(g).connect(a.destination);n.start(t)}
function pop(){tone(520,.1,'triangle',.06);tone(780,.12,'triangle',.05,.06)}
function click(){tone(700,.05,'square',.03)}
function boing(){const a=actx();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(110,t+.35);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.4)}
function fanfare(s){(s?[660,990]:[523,659,784,1047]).forEach((f,i)=>tone(f,.28,'triangle',.08,i*.11))}
mis();say.innerHTML='¡Hola! 🛹 <b>Arrastra al skater</b> hacia arriba por la rampa y suéltalo. Toca <b>🎯 Reto</b> para predecir.';requestAnimationFrame(loop);
})();
</script>
<script src="moli.js"></script>
</body>
</html>
