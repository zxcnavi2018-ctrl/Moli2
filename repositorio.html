<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repositorio Educativo · Molí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2e4f;--blue:#0a6aa1;--blue2:#1583c4;--sky:#e7f2fa;--green:#8cc63f;--green2:#6aa52b;--mint:#eef8e3;--cream:#fbfaf6;--ink:#17324d;--ink2:#4b6075;--line:#d9e4ee;--gold:#f5b62a;--red:#e2483d;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
/* encabezado */
.top{position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px 12px;color:#fff;background:linear-gradient(115deg,var(--navy) 0%,var(--blue) 62%,#1a8bc9 100%);overflow:hidden;flex:none}
.top::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(140,198,63,.55),rgba(140,198,63,0) 68%);pointer-events:none}
.top .moli{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));flex:none;animation:bob 3s ease-in-out infinite}
.brand{flex:1;min-width:0}
.brand small{display:block;font-weight:900;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#cfe8a7}
.brand h1{margin:2px 0 0;font:900 clamp(22px,3.2vw,34px)/1.05 var(--serif);letter-spacing:.01em}
.me{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:800;font-size:13px;white-space:nowrap}
.me i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--navy);font-style:normal;font-weight:900}
.me .rol{padding:2px 8px;border-radius:999px;background:var(--gold);color:#3b2a00;font-size:11px;font-weight:900}
/* equipo de la revista: organigrama */
.eq-h{text-align:center;margin:4px 0 18px}.eq-h h2{margin:0;font:900 clamp(26px,4vw,38px)/1.1 var(--serif);color:var(--navy)}.eq-h p{margin:6px auto 0;max-width:620px;font-weight:700;color:var(--ink2)}
.org{display:flex;flex-direction:column;align-items:center}
.org .lvl{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
.org .ln{width:4px;height:28px;background:var(--line);border-radius:4px}
.org .rama{position:relative;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:24px}
.org .rama::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:4px;background:var(--line);border-radius:4px}
.org .sec{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px;border-radius:20px;background:#fff;border:2px solid var(--line)}
.org .sec::before{content:"";position:absolute;top:-24px;left:50%;width:4px;height:24px;margin-left:-2px;background:var(--line)}
.org .sec>b{padding:4px 14px;border-radius:999px;background:var(--navy);color:#fff;font-weight:900;font-size:14px}
.pc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;width:100%;max-width:330px;padding:16px 14px 14px;border-radius:20px;background:#fff;border:3px solid var(--line);box-shadow:0 10px 24px -16px rgba(11,46,79,.5)}
.pc .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:900 24px var(--serif);color:#fff;background:linear-gradient(135deg,var(--blue),var(--navy));box-shadow:0 0 0 4px #fff,0 0 0 7px var(--gold)}
.pc h4{margin:6px 0 0;font:900 17px/1.2 var(--serif);color:var(--navy)}
.pc .cg{padding:3px 12px;border-radius:999px;background:var(--gold);color:#3b2a00;font-weight:900;font-size:12px;letter-spacing:.04em}
.pc ul{margin:6px 0 0;padding:0;list-style:none;text-align:left;font-size:13px;font-weight:700;color:var(--ink2);display:grid;gap:3px}
.pc .nr{margin-top:4px;font-size:12px;font-weight:900;color:var(--green2)}
.pc.doc{max-width:420px;border-color:var(--gold);background:linear-gradient(180deg,#fffbeb,#fff)}.pc.doc .av{width:78px;height:78px;font-size:30px}
.pc.rc{border-color:#bfdbfe}.pc.rc .av{background:linear-gradient(135deg,#22c55e,#0a6aa1)}.pc.rc .cg{background:#dbeafe;color:#1e3a8a}
.pc.vac{border-style:dashed;background:#f8fafc;box-shadow:none}.pc.vac .av{background:#e2e8f0;color:#94a3b8;box-shadow:0 0 0 4px #fff,0 0 0 7px #e2e8f0}.pc.vac h4{color:#94a3b8}
.pc.aut{max-width:640px;border-color:#d4ecb8;background:var(--mint)}.pc.aut .av{background:linear-gradient(135deg,var(--green),var(--green2))}.pc.aut .cg{background:var(--green);color:var(--navy)}
.pc.mini{padding:10px 8px;gap:3px}.pc.mini .av{width:44px;height:44px;font-size:17px}.pc.mini h4{font-size:15px;margin-top:4px}.pc.mini .cg{font-size:11px}
.rc-fn{margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 14px;border-radius:18px;background:#eff6ff;border:2px solid #bfdbfe;max-width:900px}.rc-fn b{width:100%;text-align:center;font:900 16px var(--serif);color:var(--navy)}.rc-fn span{padding:5px 11px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;color:#1e3a8a}
.eq-fn{margin:24px auto 0;max-width:900px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.eq-fn div{padding:14px;border-radius:18px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--ink2)}.eq-fn b{display:block;font:900 17px var(--serif);color:var(--navy);margin-bottom:4px}
@media (max-width:820px){.org .rama{grid-template-columns:repeat(2,minmax(0,1fr));padding-top:0}.org .rama::before,.org .sec::before{display:none}.eq-fn{grid-template-columns:1fr}}
/* 🔎 Similitud (tipo Turnitin) */
.sm-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}.sm-h h2{margin:0;flex:1;font:900 clamp(24px,3.4vw,34px)/1.1 var(--serif);color:var(--navy)}
.sm-l{display:grid;gap:10px}
.sm-r{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;border:2px solid var(--line)}
.sm-r .ic{font-size:30px;flex:none}.sm-r .t{flex:1;min-width:0}.sm-r .t b{display:block;font:800 17px/1.2 var(--serif);color:var(--navy)}.sm-r .t span{font-size:13px;font-weight:800;color:var(--ink2)}
.sm-p{padding:6px 12px;border-radius:999px;font-weight:900;font-size:13px;white-space:nowrap;background:#f1f5f9;color:#64748b}
.sm-p.v0{background:var(--mint);color:var(--green2)}.sm-p.v1{background:#fef9c3;color:#854d0e}.sm-p.v2{background:#ffedd5;color:#9a3412}.sm-p.v3{background:#fde8e6;color:#b23a30}.sm-p.ac{background:#e0f2fe;color:#075985}
.sm-r .btn{padding:10px 16px;font-size:14px}
.sm-scan{padding:34px 20px;text-align:center}.sm-scan .bk{font-size:64px;animation:smB .6s ease-in-out infinite alternate}.sm-scan b{display:block;margin-top:8px;font:900 22px var(--serif);color:var(--navy)}.sm-scan span{display:block;min-height:22px;margin-top:6px;font-weight:800;color:var(--ink2)}
.sm-bar{height:12px;margin:16px auto 0;max-width:420px;border-radius:99px;background:var(--line);overflow:hidden}.sm-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue2));transition:width .12s}
@keyframes smB{to{transform:translateY(-8px) rotate(-6deg)}}
.sm-top{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:16px;border-radius:20px;background:#fff;border:2px solid var(--line)}
.sm-ring{--p:0;--c:var(--green2);width:118px;height:118px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e5edf3 0)}
.sm-ring>div{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1}.sm-ring b{font:900 30px var(--serif);color:var(--navy)}.sm-ring small{display:block;font-size:11px;font-weight:900;color:var(--ink2)}
.sm-v{flex:1;min-width:220px}.sm-v h3{margin:0 0 4px;font:900 22px/1.15 var(--serif)}.sm-v p{margin:0;font-weight:700;color:var(--ink2)}
.sm-v.v0 h3{color:var(--green2)}.sm-v.v1 h3{color:#a16207}.sm-v.v2 h3{color:#c2410c}.sm-v.v3 h3{color:var(--red)}
.sm-src{display:grid;gap:8px}
.sm-s{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:left}
.sm-s.on{border-color:var(--navy);box-shadow:0 0 0 3px #cfe3f3}.sm-s .cl{width:16px;height:16px;border-radius:5px;flex:none}.sm-s .t{flex:1;min-width:0;font-weight:800;font-size:14px}.sm-s .t small{display:block;font-weight:700;color:var(--ink2)}.sm-s em{font-style:normal;font:900 20px var(--serif);color:var(--navy)}
.sm-cmp{display:grid;grid-template-columns:1fr;gap:12px}.sm-cmp.dos{grid-template-columns:1fr 1fr}
.sm-tx{padding:14px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:15px;line-height:1.6;white-space:pre-wrap;max-height:52vh;overflow:auto}
.sm-tx h5{margin:0 0 8px;font:900 14px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:normal}
.sm-tx mark{border-radius:4px;padding:0 2px;color:inherit}.sm-tx mark.dim{opacity:.35}
.c0{background:#fecaca}.c1{background:#fde68a}.c2{background:#bfdbfe}.c3{background:#ddd6fe}.c4{background:#bbf7d0}.c5{background:#fbcfe8}
.sm-web{padding:14px 16px;border-radius:18px;background:#faf5ff;border:2px solid #e9d5ff}.sm-web h4{margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sm-wh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #e9d5ff}.sm-wh q{flex:1;min-width:220px;font-size:14px;font-weight:700;color:var(--ink)}.sm-wh .btn{padding:8px 14px;font-size:13px;text-decoration:none}
.sm-wl{margin:4px 0;font-weight:700;color:var(--ink2);font-size:14px}.sm-web summary{cursor:pointer;font-weight:900;color:#6b21a8;padding:6px 0}
.sm-tx mark.cw{background:#e9d5ff;text-decoration:underline wavy #9333ea}
.sm-ia{padding:14px 16px;border-radius:18px;background:#fff7ed;border:2px solid #fed7aa}.sm-ia h4{margin:0 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sm-ip{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.sm-ip span{padding:8px 12px;border-radius:14px;background:#fff;border:2px solid #fed7aa;font-size:13.5px;font-weight:800;color:var(--ink)}.sm-ip small{display:block;margin-top:2px;font-weight:700;color:#9a3412}
.sm-ia summary{cursor:pointer;font-weight:900;color:#c2410c;padding:6px 0}.sm-ia .sm-tx{max-height:40vh}
.sm-tx mark.ci{background:#fed7aa;border-bottom:2px dotted #ea580c}
.sm-ley{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:800;color:var(--ink2)}
@media (max-width:720px){.sm-cmp.dos{grid-template-columns:1fr}.sm-r{flex-wrap:wrap}}
/* pestañas */
.tabs{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;display:flex;align-items:center;gap:8px;padding:11px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;font-weight:900;font-size:15px;color:var(--ink2);white-space:nowrap;transition:all .2s}
.tabs button:hover{border-color:var(--blue2);color:var(--blue)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 16px -6px rgba(11,46,79,.6)}
.tabs button .cnt{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center}
.tabs button[hidden],.tabs button .cnt[hidden]{display:none}
main{flex:1;overflow:auto;padding:18px 20px 40px;scroll-behavior:smooth}
.wrap{max-width:1100px;margin:0 auto}
/* globo de Molí */
.tip{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px 16px;border-radius:18px;background:var(--sky);border:2px solid #cfe3f3;font-weight:800;color:var(--navy)}
.tip img{width:46px;height:46px;object-fit:contain;flex:none}
.tip.green{background:var(--mint);border-color:#d4ecb8}
/* portada de la revista */
.cover{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;padding:24px 26px;border-radius:24px;color:#fff;background:linear-gradient(130deg,var(--navy),var(--blue) 70%);overflow:hidden;margin-bottom:16px}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 18px);pointer-events:none}
.cover .ed{font-weight:900;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfe8a7}
.cover h2{margin:4px 0 6px;font:900 clamp(30px,5vw,54px)/1 var(--serif)}
.cover h2 em{font-style:normal;color:var(--green)}
.cover p{margin:0;max-width:560px;font-weight:700;opacity:.92}
.cover img{width:clamp(80px,12vw,130px);filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));position:relative}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:14px;color:var(--ink2)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:0;border-radius:20px;background:#fff;box-shadow:0 2px 0 var(--line),0 10px 24px -14px rgba(11,46,79,.45);overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 2px 0 var(--line),0 18px 30px -14px rgba(11,46,79,.55)}
.card .ph{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--sky),#d5ebf8);display:grid;place-items:center;font-size:54px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ty{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:999px;background:rgba(11,46,79,.85);color:#fff;font-size:12px;font-weight:900}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font:800 18px/1.2 var(--serif);color:var(--navy)}
.card .by{font-size:13px;font-weight:800;color:var(--ink2)}
.card .un{align-self:flex-start;padding:3px 9px;border-radius:999px;background:var(--mint);color:var(--green2);font-size:12px;font-weight:900}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 16px;text-align:center;color:var(--ink2);font-weight:800}
.empty img{width:120px}
.empty b{font:900 22px var(--serif);color:var(--navy)}
/* fuentes */
.src-sec{margin:0 0 20px}
.src-sec h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:900 21px var(--serif);color:var(--navy)}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.src{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:#fff;border:2px solid var(--line);text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
.src:hover{border-color:var(--green);transform:translateY(-2px)}
.src .ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--sky);font-size:26px}
.src b{display:block;font-size:16px;color:var(--navy)}
.src span{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);line-height:1.35;margin-top:2px}
.src small{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:var(--mint);color:var(--green2);font-weight:900;font-size:11.5px}
.check{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0 0 20px;padding:0;list-style:none}
.check li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:#fff;border:2px dashed #c9dced;font-weight:800;font-size:14.5px}
.check li i{font-style:normal;font-size:22px;line-height:1}
.cite{padding:14px 16px;border-radius:16px;background:#fff7e0;border:2px solid #f6dc8b;font-weight:800;color:#5b4300}
.cite code{display:block;margin-top:6px;padding:8px 10px;border-radius:10px;background:#fff;font-family:inherit;font-weight:700;color:var(--ink)}
/* formulario */
.form{display:grid;gap:14px;max-width:760px}
.fld label{display:block;margin:0 0 6px;font-weight:900;font-size:15px;color:var(--navy)}
.fld small{display:block;margin-top:4px;font-weight:700;color:var(--ink2);font-size:13px}
.fld input[type=text],.fld input[type=url],.fld textarea{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:700;font-size:16px;outline:none;transition:border-color .2s}
.fld textarea{min-height:110px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(21,131,196,.15)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:15px}
.opts button.on{border-color:var(--blue);background:var(--blue);color:#fff}
.tr-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tr-slots .sl{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;padding:7px 9px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font:700 12.5px var(--sans);color:#334155}
.tr-slots .sl b{font-size:11.5px;color:#64748b}.tr-slots .sl em{font-style:normal;font-weight:900;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr-slots button.sl{cursor:pointer}
.tr-slots .sl.ok{border-color:#86efac;background:#f0fdf4}.tr-slots .sl.mj{border-color:#fdba74;background:#fff7ed}.tr-slots .sl.rv{border-color:#93c5fd;background:#eff6ff}.tr-slots .sl.pe{border-style:dashed;background:#f8fafc;color:#94a3b8}
.tr-r .tr-st{min-width:84px}
.pq{margin:2px 0 6px;font:italic 700 16px/1.4 var(--serif);color:#0f4c81}.feat .pq{font-size:19px}.card .pq{font-size:14px;margin:0 0 4px}.res .pq{font-size:14.5px;margin:2px 0 4px}
.pdfb{justify-self:start;padding:6px 12px!important;font-size:13px!important}
.tyw{display:inline-flex;align-items:center;gap:3px}.opts button.lock{opacity:.5;cursor:not-allowed;background:#f1f5f9}
.opts .tlk{padding:6px 8px;border-radius:10px;border:2px dashed #94a3b8;font-size:14px;background:#fff}.opts .tlk.on{border:2px solid #dc2626;background:#fee2e2}
.photo{display:flex;align-items:center;gap:12px;padding:12px;border:2px dashed #b9d3e8;border-radius:16px;background:#fff;font-weight:800;color:var(--ink2)}
.photo img{width:110px;height:74px;object-fit:cover;border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border:0;border-radius:16px;font-weight:900;font-size:16px;transition:transform .15s,filter .15s}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(180deg,#9ad24d,var(--green2));color:#123000;box-shadow:0 4px 0 #4f7f1d}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 #07486e}
.btn.soft{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:2px solid #f3c4c0}
.btn[disabled]{opacity:.5;pointer-events:none}
.mine{display:grid;gap:10px;margin-top:22px;max-width:760px}
.mine h3{margin:0;font:900 20px var(--serif);color:var(--navy)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;color:var(--navy)}
.row .t span{font-size:13px;font-weight:700;color:var(--ink2)}
.st{padding:5px 10px;border-radius:999px;font-weight:900;font-size:12.5px;white-space:nowrap}
.st.pend{background:#fff4d6;color:#8a6100}.st.ok{background:var(--mint);color:var(--green2)}.st.no{background:#fde8e6;color:#b23a30}
.fb{margin-top:6px;padding:8px 10px;border-radius:12px;background:#fff7e0;font-weight:800;font-size:13.5px;color:#5b4300}
/* artículo / revisión */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,26,45,.6);backdrop-filter:blur(3px);animation:fade .2s}
#modal[hidden]{display:none}
.art{position:relative;width:min(860px,100%);max-height:100%;overflow:auto;border-radius:24px;background:var(--cream);box-shadow:0 30px 70px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.art .hero{position:relative;background:linear-gradient(130deg,var(--navy),var(--blue));color:#fff;padding:22px 24px 18px}
.art .hero small{font-weight:900;letter-spacing:.2em;font-size:11px;text-transform:uppercase;color:#cfe8a7}
.art .hero h2{margin:6px 0 4px;font:900 clamp(24px,4vw,36px)/1.1 var(--serif)}
.art .hero .by{font-weight:800;opacity:.9}
.art .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;font-weight:900}
.art .img{display:block;width:100%;max-height:420px;object-fit:contain;background:#0b1b2c}
.art .bd{padding:18px 24px 22px;display:grid;gap:12px}
.art .bd p{margin:0;font-weight:700;font-size:16.5px;line-height:1.55;white-space:pre-line}
.art .bd h4{margin:6px 0 0;font:900 16px var(--serif);color:var(--navy)}
.art .rv{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--mint);color:var(--green2);font-weight:900;font-size:13px;justify-self:start}
.art .acts{display:flex;flex-wrap:wrap;gap:10px;padding-top:6px;border-top:2px dashed var(--line)}
.art textarea{width:100%;min-height:80px;padding:12px;border:2px solid var(--line);border-radius:14px;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:16px;background:var(--navy);color:#fff;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .3s}
#toast[hidden]{display:none}
.pin{display:grid;gap:10px;justify-items:center;text-align:center;padding:24px;max-width:360px;margin:30px auto;border-radius:24px;background:#fff;border:2px solid var(--line)}
.pin input{width:150px;padding:12px;border:2px solid var(--line);border-radius:14px;text-align:center;font-size:26px;font-weight:900;letter-spacing:.4em}
.load{padding:30px;text-align:center;font-weight:900;color:var(--ink2)}
/* ---- estilo profesional ---- */
.top .mark{white-space:nowrap;flex-direction:row;display:flex;align-items:center;justify-content:center}
.feat .ph{position:relative;display:grid;place-items:center;font-size:96px;overflow:hidden;aspect-ratio:auto;min-height:260px}.feat .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .ph .ty,.card .ph .ty{position:absolute;left:12px;top:12px;padding:4px 10px;border-radius:6px;background:rgba(11,46,79,.88);color:#fff;font-size:11px;font-weight:900;letter-spacing:.06em}
.top .mark{flex:none;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:#fff;color:var(--navy);font:900 22px/1 var(--serif);letter-spacing:-.04em;box-shadow:0 6px 16px rgba(0,0,0,.25)}.top .mark i{font-style:normal;color:var(--green2)}

.mast{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding:6px 0 18px;margin-bottom:22px;border-bottom:3px double var(--navy)}
.mast .kick{display:block;font-weight:900;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
.mast h2{margin:6px 0 6px;font:900 clamp(34px,6vw,64px)/.95 var(--serif);color:var(--navy);letter-spacing:-.01em}.mast h2 em{font-style:normal;color:var(--green2)}
.mast p{margin:0;max-width:620px;font-weight:700;color:var(--ink2)}
.mast-r{text-align:right;padding:10px 16px;border-left:2px solid var(--line)}.mast-r b{display:block;font:900 40px/1 var(--serif);color:var(--navy)}.mast-r span{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.sech{display:flex;align-items:center;gap:12px;margin:26px 0 14px}.sech h3{margin:0;font:900 13px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--navy);white-space:nowrap}.sech::after{content:"";flex:1;height:2px;background:var(--navy);opacity:.15}
.feat{display:grid;grid-template-columns:1.25fr 1fr;gap:0;width:100%;text-align:left;padding:0;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 14px 34px -22px rgba(11,46,79,.55);transition:transform .2s}
.feat:hover{transform:translateY(-3px)}.feat .ph{aspect-ratio:16/10;border-radius:0}.feat .bd{padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.feat .kk{font-weight:900;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}.feat h3{margin:0;font:900 clamp(22px,2.6vw,32px)/1.1 var(--serif);color:var(--navy)}
.feat .ex{margin:0;font-weight:600;color:var(--ink2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.feat .by{margin-top:auto;font-weight:800;font-size:14px;color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.card{border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 24px -18px rgba(11,46,79,.5)}.card .ph{font-size:46px}.card .ty{border-radius:6px;font-size:11px;letter-spacing:.06em}
.card .dt{font-size:12px;font-weight:800;color:#8aa0b4;letter-spacing:.04em}
.ph.t-inv{background:linear-gradient(135deg,#dbeafe,#bfdbfe)}.ph.t-pro{background:linear-gradient(135deg,#fef3c7,#fde68a)}.ph.t-maq{background:linear-gradient(135deg,#ede9fe,#ddd6fe)}.ph.t-info{background:linear-gradient(135deg,#dcfce7,#bbf7d0)}.ph.t-vid{background:linear-gradient(135deg,#fee2e2,#fecaca)}.ph.t-exp{background:linear-gradient(135deg,#e0f2fe,#bae6fd)}
.chip{border-width:1px;font-size:13px;padding:7px 13px}.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.empty{padding:40px 16px;border:1px dashed var(--line);border-radius:16px;background:#fff}
/* buscador */
.se{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 18px}
.se-logo{display:flex;align-items:baseline;gap:10px;font:900 clamp(36px,6vw,58px)/1 var(--serif);color:var(--navy);letter-spacing:-.02em}.se-logo span{font-size:.8em}.se-logo small{font:800 14px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.se-box{display:flex;width:min(680px,100%);border:1px solid #cdd8e3;border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(11,46,79,.08);overflow:hidden}.se-box:focus-within{box-shadow:0 4px 18px rgba(11,46,79,.18);border-color:var(--blue2)}
.se-box input{flex:1;min-width:0;border:0;outline:0;padding:15px 22px;font-size:17px;font-weight:700;background:transparent}.se-box button{border:0;padding:0 24px;background:var(--navy);color:#fff;font-weight:900;font-size:15px}
.se-sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:13px;font-weight:800;color:var(--ink2)}.se-sug button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;color:var(--blue)}
.se-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;margin-top:10px}
.se-n{font-size:13px;font-weight:700;color:#8aa0b4;margin:0 0 14px}
.res{margin:0 0 22px;max-width:640px}.res .u{display:flex;align-items:center;gap:8px;font-size:13px;color:#3c4f62;font-weight:700}.res .u .fv{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sky);font-size:15px}
.res .u small{display:block;color:#7b8fa3;font-weight:600}.res a.t{display:inline-block;margin:6px 0 2px;font:800 20px/1.25 var(--sans);color:#1a4fbf;text-decoration:none}.res a.t:hover{text-decoration:underline}
.res p{margin:0;font-weight:600;color:#4b5b6b;line-height:1.5;font-size:14.5px}.res .ok{display:inline-block;margin-top:5px;font-size:12px;font-weight:900;color:var(--green2)}
.se-res{max-width:760px;margin:6px auto 0}.res .kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.res .kws button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px;color:var(--blue)}.res .kws button.hit{background:#fef08a;border-color:#facc15;color:#0b2e4f}
.res.web{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#f8fbfe}.res.rv a.t{color:var(--navy)}
.aside{display:grid;gap:14px;align-content:start}.aside .bx{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.aside h4{margin:0 0 10px;font:900 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--navy)}
.aside ul{margin:0;padding-left:18px;font-weight:700;font-size:13.5px;color:var(--ink2);line-height:1.5}.aside code{display:block;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--sky);font-family:inherit;font-weight:700;font-size:13px}
.teach{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:#fff7e0;border:1px solid #f6dc8b;font-weight:800;color:#5b4300;margin-bottom:16px}
@media (max-width:820px){.feat{grid-template-columns:1fr}.trio{grid-template-columns:1fr}.se-cols{grid-template-columns:1fr}.mast{grid-template-columns:1fr}.mast-r{text-align:left;border-left:0;padding:0}}
/* guía de citas y formato Word */
.guia{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin:0 0 20px}
.g-cit{padding:14px 16px;border:1px solid #cfe7a8;border-radius:14px;background:#f6fbef}.g-cit h4{margin:0 0 10px;font:900 15px var(--sans);color:var(--navy)}.g-cit h4 span{color:var(--green2);font-weight:800}
.g-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g-2>div{padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #e2efd0}.g-2 b{display:block;color:var(--navy);font-size:14px}.g-2 small{display:block;color:var(--ink2);font-weight:700;font-size:12.5px;margin:2px 0 6px}
.g-2 q{display:block;font-style:italic;font-weight:700;font-size:13.5px;color:#1e3a5f;quotes:none;border-left:3px solid var(--green);padding-left:8px}
.guia>a.g-pdf{grid-column:2;justify-self:end;margin-top:-6px;font-weight:900;font-size:13px;color:#b42318;text-decoration:none}.guia>a.g-pdf:hover{text-decoration:underline}
.g-doc{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}.g-doc:hover{border-color:#2b579a;transform:translateY(-2px)}
.g-doc .ic{flex:none;display:grid;place-items:center;width:48px;height:56px;border-radius:8px;background:#2b579a;color:#fff;font:900 24px var(--serif)}.g-doc b{display:block;color:var(--navy)}.g-doc small{display:block;color:var(--ink2);font-weight:700;font-size:12.5px;line-height:1.35;margin-top:2px}.g-doc em{font-style:normal;font-weight:900;color:#2b579a;font-size:20px}
.res p.kw{margin-top:3px;font-size:12.5px;color:#6b7c8f}
@media (max-width:820px){.guia>a.g-pdf{grid-column:1}.guia{grid-template-columns:1fr}.g-2{grid-template-columns:1fr}}
/* citas protagonistas */
.citas{margin:0 0 16px;border-radius:18px;overflow:hidden;border:1px solid #cfe7a8;background:#fff;box-shadow:0 14px 34px -24px rgba(11,46,79,.6)}
.c-top{position:relative;padding:18px 22px 14px;background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff}.c-top h3{margin:0 0 6px;font:900 clamp(22px,3vw,30px)/1.1 var(--serif)}.c-top h3 small{font:800 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#cfe8a7;margin-left:6px}
.c-top p{margin:0;max-width:760px;font-weight:700;opacity:.95;line-height:1.5}.c-badge{position:absolute;right:18px;top:16px;padding:6px 12px;border-radius:999px;background:var(--gold);color:#3b2a00;font-weight:900;font-size:12px;letter-spacing:.12em}
.c-2{display:grid;grid-template-columns:1fr 1fr;gap:0}.c-2 article{position:relative;padding:18px 22px 20px}.c-2 article+article{border-left:1px solid var(--line)}
.c-n{position:absolute;right:18px;top:14px;font:900 46px/1 var(--serif);opacity:.12}.c-a{background:#f6fbef}.c-b{background:#f3f0ff}
.c-2 h4{margin:0 0 4px;font:900 20px var(--serif);color:var(--navy)}.c-d{margin:0 0 10px;font-weight:700;color:var(--ink2)}
.c-2 blockquote{margin:0;padding:12px 14px;border-radius:12px;background:#fff;font:italic 700 17px/1.5 var(--serif);color:#1e3a5f;border-left:5px solid var(--green)}.c-b blockquote{border-left-color:#7c3aed}
.c-2 mark{background:#fef08a;padding:0 3px;border-radius:4px;font-style:normal;font-weight:900;color:#0b2e4f}.c-m{margin:10px 0 0;font-weight:800;font-size:14px;color:var(--ink2)}
.formatos{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 20px;max-width:760px}.g-doc.pdf .ic{background:#b42318;font-size:15px}.g-doc.pdf:hover{border-color:#b42318}
.f-h{margin:6px 0 2px;font:900 20px var(--serif);color:var(--navy)}
@media (max-width:820px){.c-2,.formatos{grid-template-columns:1fr}.c-2 article+article{border-left:0;border-top:1px solid var(--line)}.c-badge{position:static;display:inline-block;margin-bottom:8px}}
.anx{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.anx figure{margin:0}.anx img{width:100%;border-radius:10px;border:1px solid var(--line)}.anx figcaption{font-size:12px;font-weight:800;color:var(--ink2);margin-top:3px}.photo img{width:70px;height:50px;margin-right:4px}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
@keyframes fade{from{opacity:0}}
@media (max-width:640px){.top{padding:10px 14px}.top .moli{width:46px;height:46px}.me .nm{display:none}.tabs button span{display:none}.tabs button{padding:10px 14px;font-size:18px}main{padding:14px 12px 30px}.cover{grid-template-columns:1fr;padding:18px}.cover img{display:none}}
@media (max-height:520px){.top{padding:8px 16px}.top .moli{width:40px;height:40px}.brand small{display:none}.tabs{padding:6px 12px}.tabs button{padding:7px 13px;font-size:14px}main{padding:12px 16px 24px}}
#dniAviso{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(11,46,79,.55);padding:16px;animation:daIn .25s ease}#dniAviso[hidden]{display:none}
#dniAviso .da-c{position:relative;overflow:hidden;max-width:460px;width:100%;background:#fff;border-radius:22px;padding:26px 26px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);border:4px solid #facc15}
#dniAviso .da-i{font-size:64px;line-height:1}#dniAviso h3{margin:10px 0 6px;font:900 26px var(--serif);color:var(--navy)}#dniAviso p{margin:6px 0;font-weight:700;color:#334155;font-size:17px}#dniAviso .da-s{font-size:15px;color:#64748b}

.tr-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 14px}.tr-top h2{margin:0;font:900 26px var(--serif);color:var(--navy);flex:1;min-width:220px}
.tr-sec{display:flex;gap:6px}.tr-sec button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:900 15px var(--sans);color:var(--navy);cursor:pointer}.tr-sec button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tr-res{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}.tr-res span{padding:8px 14px;border-radius:14px;font-weight:900;background:#f1f5f9;color:#334155}.tr-res .ok{background:#dcfce7;color:#166534}.tr-res .pe{background:#fef3c7;color:#92400e}.tr-res .en{background:#dbeafe;color:#1e40af}
.tr-l{display:grid;gap:8px}.tr-r{display:grid;grid-template-columns:34px minmax(170px,1.1fr) 2fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:#fff}

.tr-r.ok{background:#f0fdf4;border-color:#bbf7d0}.tr-msg{min-height:20px;font-weight:800;color:#64748b;font-size:13px}

  const r = await fetch(`${BASE}:runQuery?key=${F.apiKey}`, { method: 'POST', headers: h, body: JSON.stringify(q) });

}

async function pbkdf(pass, salt, iter, bits) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(salt), iterations: iter }, k, bits);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

}

async function shrinkImg(file, max, q) {

    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
let AYUDA = null, LABS = null;
async function limpiarGuia(raw) {                                      // quita de la guía las instrucciones, ejemplos y casillas vacías: queda sólo lo que escribió el estudiante
  if (!AYUDA) { try { const j = await (await fetch('docs/guias/ayuda.json')).json(); AYUDA = new Set(j.ayuda); LABS = new Set(j.labs); } catch (e) { AYUDA = new Set(); LABS = new Set(); } }
  const L = [];
  String(raw).split(/\n/).map(x => x.replace(/_{3,}/g, ' ').replace(/\s*\(Molde.*$/, '').replace(/[ \t]+/g, ' ').trim()).forEach(x => {
    if (!x || AYUDA.has(x)) return;
    if (/^(REVISTA INNOVADORA · GUÍA|Ejemplo:|Orden:|💡|☐|¿Cómo lo publico\?|A\. Cita narrativa:|B\. Cita parentética:)/.test(x)) return;
    if (/^\d+\.?$/.test(x) && !/^(19|20)\d\d$/.test(x)) return;      // números de los pasos «1.» (no los años)
    const paso = /^PASO \d+/.test(x); if (paso) x = x.replace(/^PASO \d+\s*/, 'PASO ');
    L.push({ x, paso, lab: !paso && LABS.has(x) });
  });
  const vacio = i => i >= L.length || L[i].paso || L[i].lab;
  const conAlgo = i => { for (let j = i + 1; j < L.length && !L[j].paso && !/^Fuente \d/.test(L[j].x); j++) if (!L[j].lab) return true; return false; };
  const A = L.filter((o, i) => !(o.lab && (/^Fuente \d/.test(o.x) ? !conAlgo(i) : vacio(i + 1))));   // etiquetas sin respuesta
  for (let i = 0; i < A.length - 1; i++) { const o = A[i], n = A[i + 1];                    // «Año» + «2025» → «Año: 2025»
    if (o.lab && !n.lab && !n.paso && !/^Fuente \d/.test(o.x) && o.x.length <= 20 && !/[?…:]$/.test(o.x)) { o.x = o.x + ': ' + n.x; o.lab = false; A.splice(i + 1, 1); } }
  const B = A.filter((o, i) => !(o.paso && (i + 1 >= A.length || A[i + 1].paso)));   // pasos sin nada
  return B.map(o => o.x).join('\n').slice(0, 20000);
}

  const lib = (SIM.src || []).filter(x => x.k !== w.k);
  M.innerHTML = `<div class="art"><div class="sm-scan"><div class="bk">📚</div><b>Revisando similitudes en la Biblioteca…</b><span id="smEs"></span><div class="sm-bar"><i id="smBa"></i></div></div></div>`;
  const pasos = Math.max(lib.length, 1), ms = Math.min(140, 2200 / pasos);
  for (let i = 0; i < pasos; i++) { if (M.dataset.id !== id || M.hidden) return; const x = lib[i], es = $('#smEs'), ba = $('#smBa');
    if (es) es.textContent = x ? `📖 Comparando con «${x.t}» de ${firstName(x.n)}…` : '📖 Comparando…'; if (ba) ba.style.width = (100 * (i + 1) / pasos) + '%'; await new Promise(r => setTimeout(r, ms)); }
  SIM.res[id] = smComparar(w); SIM.res[id].ia = smIA(w); if (M.dataset.id === id && !M.hidden) pintaInforme(); pintaSim(); smWeb(w, SIM.res[id]);
}
function pintaInforme() {
  const M = $('#modal'), w = SIM.w, r = SIM.res[w.id]; if (!r) return;
  const own = ME && w.k === ME.key && !ROLE.t, ro = own || miSec(w), f0 = r.fuentes[0], wp = r.web && r.web.st === 'ok' ? r.web.p : 0, tp = Math.min(100, r.p + wp);
  const nv = Math.max(r.nv, smNivel(tp, Math.max(r.max, wp))), v = SM_V[nv], wh = r.web && r.web.hits[0];
  const txt3 = wp > r.max && nv >= 2 && wh ? `El ${wp}% es igualito a internet (Wikipedia: «${wh.hit.t}»). ${nv === 3 ? '¡Lo copió y pegó de internet!' : 'Debe parafrasear y citar la fuente.'}` : nv === 3 && f0 ? `El ${f0.p}% es igualito al librito «${f0.s.x.t}» de ${f0.s.x.n}${f0.cita ? ' (sí lo cita, pero copió textual: falta parafrasear).' : '. ¡Lo copió y pegó sin citarlo!'}` : v[2];
  const sug = wp > r.max && nv >= 2 && wh ? `Copiaste partes de internet (Wikipedia: «${wh.hit.t}»). Escríbelo con tus palabras (parafrasea) y pon la fuente con su año.` : nv < 2 && r.ia.nv === 2 ? 'Tu trabajo tiene signos y palabras que suele usar la Inteligencia Artificial (como ; — o palabras muy difíciles). Escríbelo con tus propias palabras, como tú lo explicarías.' : nv >= 2 && f0 ? `Copiaste partes del librito «${f0.s.x.t}» de ${f0.s.x.n}. Escríbelo con tus palabras (parafrasea) y cítalo así: ${f0.ape} (${smAnio(f0.s.x)}) menciona que…` : '';
  const ta = $('#rvFb'), fbTxt = ta && ta.value !== ta.dataset.sug ? ta.value : sug;   // si ya escribió su comentario, no se lo borro
  const c = ['var(--green2)', '#ca8a04', '#ea580c', 'var(--red)'][nv], fs = SIM.sel >= 0 ? r.fuentes[SIM.sel] : null;
  M.innerHTML = `<article class="art" role="dialog" aria-modal="true" style="width:min(1100px,100%)"><div class="hero"><small>🔎 Reporte de similitud · ${r.nLib} libritos revisados</small><h2>${esc(w.t)}</h2><div class="by">✍️ ${esc(w.n)} · ${esc(w.sec ? '6.° ' + w.sec : '6.°')} · ${fecha(w.at)}</div><button type="button" class="x" data-x aria-label="Cerrar">✕</button></div>
  <div class="bd">
    <div class="sm-top"><div class="sm-ring" style="--p:${tp};--c:${c}"><div><b>${tp}%</b><small>similitud</small></div></div><div class="sm-v ${v[0]}"><h3>${v[1]}</h3><p>${esc(txt3)}</p><p style="margin-top:6px">📚 ${r.p}% igual a la Biblioteca · 🌐 ${r.web && r.web.st === 'busca' ? 'buscando…' : wp + '% igual a internet'}</p>${r.corto ? '<p style="margin-top:6px">✏️ El texto es muy corto: revísalo con más cuidado.</p>' : ''}</div></div>
    ${r.fuentes.length ? `<h4>📚 ¿De dónde salen las partes iguales? <small style="font-weight:700;color:var(--ink2)">(toca uno para compararlo lado a lado)</small></h4><div class="sm-src">${r.fuentes.map((f, k) => `<button type="button" class="sm-s${SIM.sel === k ? ' on' : ''}" data-sms="${k}"><span class="cl c${k}"></span><span class="t">${f.s.lib ? '📖' : '📥'} «${esc(f.s.x.t)}» · ${esc(f.s.x.n)}${f.s.x.sec ? ' · 6.° ' + esc(f.s.x.sec) : ''}<small>${f.s.lib ? 'Librito de la Biblioteca' : 'Otro trabajo en la bandeja'} · ${f.cita ? `✔ Lo cita: ${esc(f.ape)} (${smAnio(f.s.x)})` : '✘ No lo cita'}</small></span><em>${f.p}%</em></button>`).join('')}</div>` : '<div class="tip green">📗 No encontré frases iguales en la Biblioteca ni en los otros envíos.</div>'}
    ${smWebHtml(r)}${smIAHtml(w, r)}<div class="sm-ley"><span>🟥🟨🟦 Pintado = igualito al librito de ese color</span><span>🟪 Morado ondulado = igualito a internet</span><span>Sin pintar = escrito con sus palabras</span></div>
    <div class="sm-cmp${fs ? ' dos' : ''}"><div class="sm-tx"><h5>📝 Trabajo enviado</h5>${smMarcar(w.d, r.T, r.due.map((d, i) => d < 0 && r.web && r.web.hits.some(f => r.T[i].i >= f.i && r.T[i].j <= f.j) ? 'w' : d), SIM.sel)}</div>${fs ? `<div class="sm-tx"><h5>${fs.s.lib ? '📖' : '📥'} «${esc(fs.s.x.t)}» · ${esc(fs.s.x.n)}</h5>${smMarcar(fs.s.x.d, fs.s.T, fs.mk.map(m => m ? SIM.sel : -1), -1)}</div>` : ''}</div>
    ${ro ? `<div class="tip">${own ? '🙈 Este es tu propio trabajo: lo revisará otro Revisor o tu profe.' : `👀 Este trabajo es de tu sección (6.° ${esc(ROLE.rs)}): puedes ver el reporte, pero lo decide un Revisor de otra sección o tu profe.`}</div>`
    : `<div class="acts"><textarea id="rvFb" maxlength="500" data-sug="${esc(sug)}" placeholder="Comentario para el estudiante (opcional)">${esc(fbTxt)}</textarea>
      <button type="button" class="btn go" data-rv="ok">✅ Aprobar y publicar</button><button type="button" class="btn soft" data-rv="no">✏️ Devolver (se borra)</button><button type="button" class="btn blue" data-smacc>👌 Aceptar reporte</button></div>`}
  </div></article>`;
}
async function aceptarSim(b) {                                        // deja anotado en el trabajo que ya se revisó su similitud (sigue en la bandeja)
  const w = SIM.w, r = w && SIM.res[w.id]; if (!r) return;
  const a = await staffTok(); if (!a) return toast('🔐 Vuelve a entrar para revisar.');
  b.disabled = true; const up = { fb: `🔎 Similitud ${Math.min(100, r.p + (r.web && r.web.p || 0))}% · IA: ${['pocos', 'algunos', 'muchos'][r.ia.nv]} indicios · revisado por ${ROLE.t ? 'tu profe' : firstName(ROLE.rn || ME.name)}`.slice(0, 500) };
  try { const x = await fetch(`${BASE}/revista/${encodeURIComponent(w.id)}?key=${F.apiKey}&updateMask.fieldPaths=fb&currentDocument.exists=true`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + a }, body: JSON.stringify({ fields: fieldsOf(up) }) });
    if (!x.ok) throw new Error(x.status === 403 ? 'AUTH' : 'NET');
    w.fb = up.fb; delete SIM.res[w.id]; $('#modal').hidden = true; $('#modal').innerHTML = ''; pintaSim(); toast('👌 Reporte aceptado: el trabajo sigue en la bandeja, marcado como revisado.');
  } catch (x) { b.disabled = false; toast(x.message === 'AUTH' ? '🔐 No tienes permiso para esto.' : '📶 No se pudo guardar. Intenta otra vez.', 4500); }
}

// ---- ver un trabajo (artículo de la revista o revisión) ----
async function bajarWord(id, b) {                                     // el Word que subió el estudiante (sólo la profe y los Revisores)
  const t0 = b.textContent; b.disabled = true; b.textContent = '⏳ Buscando el Word…';
  try { const a = await staffTok(); if (!a) throw new Error('AUTH');
    const r = await fetch(`${BASE}/revdoc/${encodeURIComponent(id)}?key=${F.apiKey}`, { headers: { Authorization: 'Bearer ' + a } });
    if (r.status === 404) throw new Error('NO'); if (!r.ok) throw new Error(r.status === 403 ? 'AUTH' : 'NET');
    const j = await r.json(), b64 = j.fields.b64.stringValue, n = (j.fields.n || {}).stringValue || 'trabajo.docx';
    const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
    const l = document.createElement('a'); l.href = url; l.download = n; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (x) { toast(x.message === 'NO' ? '📄 Este trabajo se envió sin el Word (fue antes de este cambio o el archivo era muy grande).' : x.message === 'AUTH' ? '🔐 Conecta tu cuenta para descargar el Word.' : '📶 No pude bajar el Word. Revisa tu internet.', 5000); }
  b.disabled = false; b.textContent = t0;
}
async function openArt(id) {
  const M = $('#modal'); M.hidden = false; M.innerHTML = '<div class="art"><div class="load">📖 Abriendo…</div></div>';
  let w = [...(CACHE.ok || []), ...(CACHE.pend || [])].find(x => x.id === id);
  try { const full = await getDoc(id); if (full) w = full; } catch (e) {}
  if (!w) { M.hidden = true; return toast('No encontré ese trabajo.'); }
  const staff = (ROLE.t || ROLE.r) && TAB === 'bandeja' && w.st === 'pend', own = ME && w.k === ME.key, link = safeUrl(w.link), t = tipo(w.ty);
  M.innerHTML = `<article class="art" role="dialog" aria-modal="true"><div class="hero"><small>${t[1]} ${t[2]} · ${unidad(w.u)[1]} ${esc(unidad(w.u)[2])}</small><h2>${esc(w.t)}</h2><div class="by">✍️ ${esc(w.n)} · ${esc(w.sec ? '6.° ' + w.sec : '6.°')} · ${fecha(w.at)}</div><button type="button" class="x" data-x aria-label="Cerrar">✕</button></div>
  <div class="bd"><p>${esc(w.d)}</p>${[w.img, w.img2, w.img3].filter(Boolean).length ? `<h4>📎 Anexos</h4><div class="anx">${[w.img, w.img2, w.img3].filter(Boolean).map((x, i) => `<figure><img src="${esc(x)}" alt="Anexo ${i + 1}"><figcaption>Anexo ${i + 1}</figcaption></figure>`).join('')}</div>` : ''}${w.f ? `<h4>📚 Fuentes</h4><p style="font-size:14.5px">${esc(w.f)}</p>` : ''}
 ${ROLE.t || ROLE.r ? '<button type="button" class="btn blue" data-word style="justify-self:start">📄 Descargar su Word</button>' : ''}
  ${link ? `<a class="btn blue" href="${esc(link)}" target="_blank" rel="noopener" style="justify-self:start;text-decoration:none">🔗 Ver el trabajo completo</a>` : ''}
  ${w.st === 'ok' && w.rv ? `<span class="rv">✔ Revisado por ${esc(w.rv)}</span>` : ''}
  ${w.st === 'ok' ? '<button type="button" class="btn soft pdfb" data-pdf>📄 Descargar PDF</button>' : ''}
  ${staff ? (own && !ROLE.t ? '<div class="tip">🙈 Este es tu propio trabajo: lo revisará otro Revisor o tu profe.</div>' : miSec(w) ? `<div class="tip">👀 Este trabajo es de tu sección (6.° ${esc(ROLE.rs)}): puedes leerlo, pero lo revisará un Revisor de otra sección o tu profe.</div>` : `<div class="acts"><textarea id="rvFb" maxlength="500" placeholder="Comentario (opcional). Ej.: ¡Buen trabajo! Agrega una foto de tu experimento."></textarea>
    <button type="button" class="btn go" data-rv="ok">✅ Publicar en la revista</button><button type="button" class="btn soft" data-rv="no">✏️ Devolver (se borra)</button>${ROLE.t ? '<button type="button" class="btn red" data-rv="del">🗑 Borrar</button>' : ''}</div>`) : ''}
  ${ROLE.t && w.st === 'ok' && TAB === 'revista' ? '<div class="acts"><button type="button" class="btn soft" data-rv="pend">↩️ Quitar de la revista</button><button type="button" class="btn red" data-rv="del">🗑 Borrar</button></div>' : ''}
  </div></article>`;
  M.dataset.id = id; M._w = w;
}
$('#modal').addEventListener('click', async e => {
  const M = $('#modal');
  if (e.target === M || e.target.closest('[data-x]')) { M.hidden = true; M.innerHTML = ''; return; }
  if (e.target.closest('[data-word]')) return bajarWord(M.dataset.id, e.target.closest('[data-word]'));
  if (e.target.closest('[data-smacc]')) return aceptarSim(e.target.closest('[data-smacc]'));
  const sx = e.target.closest('[data-sms]'); if (sx) { SIM.sel = SIM.sel === +sx.dataset.sms ? -1 : +sx.dataset.sms; return pintaInforme(); }
  if (e.target.closest('[data-pdf]')) { const w = M._w; if (w && window.pdfTrabajo) pdfTrabajo(w); return; }
  const b = e.target.closest('[data-rv]'); if (!b) return;
  const id = M.dataset.id, act = b.dataset.rv, fb = ($('#rvFb') || {}).value ? $('#rvFb').value.trim() : '';
  const borra = act === 'del' || act === 'no';                       // al devolver (profe o Revisor): se borra con su Word para que lo envíe corregido
  if (act === 'no' && !confirm('Se devolverá y se BORRARÁ este trabajo (con su Word) para que el estudiante lo vuelva a enviar corregido. ¿Seguir?')) return;
  if (act === 'del' && !confirm('¿Borrar este trabajo para siempre?')) return;
  const a = await staffTok(); if (!a) return toast('🔐 Vuelve a entrar para revisar.');
  M.querySelectorAll('[data-rv]').forEach(x => x.disabled = true);
  try {
    let r;
    const sinWord = () => fetch(`${BASE}/revdoc/${encodeURIComponent(id)}?key=${F.apiKey}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + a } }).catch(() => {});
    if (borra) { r = await fetch(`${BASE}/revista/${encodeURIComponent(id)}?key=${F.apiKey}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + a } }); sinWord(); }
    else {
      const up = { st: act, rv: ROLE.t ? 'tu profe' : String(ROLE.rn || ME.name || 'Revisor').slice(0, 60), rvAt: new Date(), fb: act === 'no' ? fb.slice(0, 500) : fb.slice(0, 500) };
      r = await fetch(`${BASE}/revista/${encodeURIComponent(id)}?key=${F.apiKey}&` + Object.keys(up).map(k => 'updateMask.fieldPaths=' + k).join('&') + '&currentDocument.exists=true', { method: 'PATCH', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + a }, body: JSON.stringify({ fields: fieldsOf(up) }) });
    }
    if (!r.ok) throw new Error(r.status === 403 ? 'AUTH' : 'NET');
    if (act === 'ok') sinWord();                                       // aprobado: queda el librito con su información; el Word ya no hace falta
    M.hidden = true; M.innerHTML = '';
    toast(act === 'no' ? '✏️ Devuelto: se borró para que lo envíe corregido.' : act === 'ok' ? '🎉 ¡Publicado en la Revista Innovadora!' : act === 'no' ? '✏️ Devuelto con tu consejo.' : act === 'pend' ? '↩️ Volvió a la bandeja.' : '🗑 Borrado.');
    CACHE.ok = null; if (CACHE.pend) CACHE.pend = CACHE.pend.filter(x => x.id !== id);
    if (TAB === 'bandeja') drawBandeja(); else if (TAB === 'similitud') pintaSim(); else vRevista();
  } catch (x) { M.querySelectorAll('[data-rv]').forEach(y => y.disabled = false); toast(x.message === 'AUTH' ? '🔐 No tienes permiso para esto.' : '📶 No se pudo guardar. Intenta otra vez.', 4500); }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) { $('#modal').hidden = true; $('#modal').innerHTML = ''; } });

// ---- inicio ----
(async function () {
  if (ME) { const me = $('#me'); me.hidden = false; me.innerHTML = `<i>${esc((firstName(ME.name)[0] || '🙂').toUpperCase())}</i><span class="nm">${esc(firstName(ME.name) || 'Hola')}</span>${ME.teacher ? '<span class="rol">Docente</span>' : ''}`; }
  await checkRole();
  if (ROLE.r) { const r = $('#me .rol'); if (!r) $('#me').insertAdjacentHTML('beforeend', '<span class="rol">🧐 Revisor</span>'); }
  if (ROLE.t || ROLE.r) { $('#tabs [data-tab="bandeja"]').hidden = !ROLE.t; $('#tabs [data-tab="similitud"]').hidden = false; }   // los Revisores revisan sólo desde «Similitud» (su bandeja)
  if (ROLE.t) $('#tabs [data-tab="trabajos"]').hidden = false;
  const want = QS.get('v'); setTab(want === 'bandeja' && ROLE.t ? 'bandeja' : want === 'bandeja' && ROLE.r ? 'similitud' : want === 'enviar' ? 'enviar' : want === 'fuentes' ? 'fuentes' : 'revista');
  if ((ROLE.t || ROLE.r) && TAB !== 'bandeja' && TAB !== 'similitud') { try { const a = await staffTok(); if (a) { CACHE.pend = await query('pend', a, ['st']); setCount(CACHE.pend.length); CACHE.pend = null; } } catch (e) {} }
})();
