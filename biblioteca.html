<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Biblioteca Educativa · Molí</title>
<meta name="theme-color" content="#3b2414">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --oro: #e9c46a; --oro2: #b8862f; --tinta: #2b1a0e; --crema: #fff8ea; --vino: #8c2f39; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a180c; font-family: Nunito, system-ui, sans-serif; color: var(--tinta); }
  canvas { display: block; touch-action: none; }
  button { font: inherit; cursor: pointer; }
  /* ---- título ---- */
  #titulo { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translate(-50%, -30px); opacity: 0; pointer-events: none; text-align: center; transition: opacity 1.2s, transform 1.2s cubic-bezier(.2,.9,.3,1.2); z-index: 5; width: min(92vw, 760px); }
  #titulo.on { opacity: 1; transform: translate(-50%, 0); }
  #titulo small { display: block; font: 800 clamp(10px, 1.6vw, 14px) Cinzel, serif; letter-spacing: .4em; color: #f6e2b3; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #titulo h1 { margin: 2px 0 0; font: 900 clamp(22px, 4.6vw, 50px)/1.05 "Cinzel Decorative", Cinzel, serif; color: #ffe7a3; letter-spacing: .03em;
    background: linear-gradient(180deg, #fff6cf 0%, #f3cf73 45%, #b8862f 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 3px 0 #3b2414) drop-shadow(0 8px 18px rgba(0,0,0,.55)); }
  #titulo .orla { display: block; height: 14px; margin: 4px auto 0; width: 70%; background: radial-gradient(circle at 50% 50%, #f3cf73 0 3px, transparent 4px) center/18px 14px repeat-x; opacity: .9; }
  /* ---- banner de escena ---- */
  #escena { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.85); opacity: 0; pointer-events: none; z-index: 6; text-align: center; transition: opacity .5s, transform .6s cubic-bezier(.2,.9,.3,1.25); }
  #escena.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #escena div { padding: 14px 34px 16px; border-radius: 14px; background: linear-gradient(180deg, rgba(59,36,20,.92), rgba(34,20,10,.92)); border: 3px solid var(--oro); box-shadow: 0 0 0 6px rgba(43,26,14,.55), 0 20px 50px rgba(0,0,0,.5); }
  #escena small { display: block; font: 800 clamp(11px, 1.6vw, 14px) Cinzel, serif; letter-spacing: .45em; color: #f6e2b3; }
  #escena b { display: block; font: 900 clamp(22px, 4.4vw, 46px)/1.1 "Cinzel Decorative", Cinzel, serif; color: #ffe7a3; letter-spacing: .04em; }
  /* ---- barra de grados ---- */
  #bar { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px; background: rgba(43,26,14,.82); border: 2px solid rgba(233,196,106,.7); box-shadow: 0 12px 30px rgba(0,0,0,.45); backdrop-filter: blur(6px); transition: opacity .6s, transform .6s; max-width: calc(100vw - 20px); }
  #bar.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #bar .g { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } #bar .g::-webkit-scrollbar { display: none; }
  #bar button { border: 0; border-radius: 999px; padding: 9px 14px; background: transparent; color: #f6e2b3; font: 800 14px Cinzel, serif; letter-spacing: .06em; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  #bar button i { font-style: normal; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: rgba(233,196,106,.2); color: #ffe7a3; font: 900 12px Nunito, sans-serif; display: grid; place-items: center; }
  #bar button:hover { background: rgba(233,196,106,.16); }
  #bar button.on { background: linear-gradient(180deg, #f3cf73, #b8862f); color: #2b1a0e; } #bar button.on i { background: rgba(43,26,14,.18); color: #2b1a0e; }
  #bar .nav { width: 42px; height: 42px; padding: 0; justify-content: center; font-size: 18px; background: rgba(233,196,106,.18); flex: none; }
  #bar .todo { flex: none; }
  #bar button.sel:not(.on) { background: rgba(233,196,106,.28); }
  #pisos { position: fixed; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 70px); transform: translateX(-50%); z-index: 7; display: flex; gap: 10px; padding: 8px; border-radius: 22px; background: rgba(43,26,14,.96); border: 2px solid rgba(233,196,106,.8); box-shadow: 0 12px 30px rgba(0,0,0,.45); animation: pisoIn .25s ease-out; }
  #pisos[hidden] { display: none; } @keyframes pisoIn { from { opacity: 0; transform: translate(-50%, 10px); } }
  #pisos button { border: 2px solid rgba(233,196,106,.5); border-radius: 16px; padding: 10px 18px; background: rgba(233,196,106,.12); color: #ffe7a3; font: 800 15px Cinzel, serif; white-space: nowrap; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  #pisos button:hover { background: rgba(233,196,106,.26); } #pisos button.on { background: linear-gradient(180deg, #f3cf73, #b8862f); color: #2b1a0e; }
  #pisos button i { font-style: normal; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: rgba(0,0,0,.25); font: 900 12px Nunito, sans-serif; display: grid; place-items: center; }
  /* ---- volver ---- */
  #volver { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); z-index: 7; border: 2px solid rgba(233,196,106,.8); border-radius: 999px; padding: 8px 14px 8px 10px; background: rgba(43,26,14,.8); color: #f6e2b3; font: 800 14px Nunito, sans-serif; display: flex; align-items: center; gap: 6px; text-decoration: none; backdrop-filter: blur(6px); }
  #volver:hover { background: rgba(70,42,22,.9); }
  #sonido { position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); z-index: 7; width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(233,196,106,.8); background: rgba(43,26,14,.8); color: #f6e2b3; font-size: 18px; }
  #pcompleta { position: fixed; right: calc(max(12px, env(safe-area-inset-right)) + 52px); top: max(12px, env(safe-area-inset-top)); z-index: 7; width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(233,196,106,.8); background: rgba(43,26,14,.8); color: #f6e2b3; font-size: 18px; }
  #editar { position: fixed; right: calc(max(12px, env(safe-area-inset-right)) + 104px); top: max(12px, env(safe-area-inset-top)); z-index: 7; height: 42px; padding: 0 14px; border-radius: 999px; border: 2px solid rgba(233,196,106,.8); background: rgba(43,26,14,.8); color: #f6e2b3; font: 800 14px Nunito, sans-serif; }
  #editar[hidden] { display: none; }
  #edPanel { position: fixed; inset: 0; z-index: 12; display: none; align-items: center; justify-content: center; padding: 14px; background: rgba(10,6,3,.7); }
  #edPanel.on { display: flex; }
  #edPanel form { width: min(760px, 100%); max-height: calc(100vh - 28px); overflow: auto; background: #fbf1da; border: 3px solid #9c7a3c; border-radius: 14px; padding: 18px 20px; color: #3b2414; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  #edPanel h2 { margin: 0 0 4px; font: 800 22px Cinzel, serif; color: #6b1f1f; } #edPanel p.d { margin: 0 0 12px; font-size: 14px; color: #6b5030; }
  #edPanel fieldset { border: 1.5px solid #d9bd85; border-radius: 10px; margin: 0 0 12px; padding: 10px 12px; } #edPanel legend { font: 800 14px Cinzel, serif; color: #7a2a22; padding: 0 6px; }
  #edPanel label { display: block; font-weight: 800; font-size: 13px; margin: 6px 0 3px; } #edPanel input, #edPanel textarea { width: 100%; padding: 8px 10px; border: 1.5px solid #c9a96a; border-radius: 8px; background: #fffaf0; font: 600 15px Nunito, sans-serif; color: #3b2414; }
  #edPanel textarea { min-height: 110px; resize: vertical; } #edPanel .gr { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; } #edPanel .gr div { display: grid; gap: 4px; } #edPanel .gr b { font-size: 12px; color: #7a5a3a; }
  #edPanel .bt { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: -18px; background: #fbf1da; padding: 10px 0 2px; } #edPanel .bt button { border: 0; border-radius: 999px; padding: 10px 16px; font: 900 14px Nunito, sans-serif; }
  #edPanel .ok { background: #6b1f1f; color: #ffe7a3; } #edPanel .no { background: #e8d6b0; color: #3b2414; } #edPanel .msg { margin-right: auto; align-self: center; font-weight: 800; font-size: 13px; color: #6b1f1f; }
  #saltar { position: fixed; right: 16px; bottom: 18px; z-index: 7; border: 2px solid rgba(233,196,106,.7); border-radius: 999px; padding: 8px 16px; background: rgba(43,26,14,.7); color: #f6e2b3; font: 800 13px Nunito, sans-serif; transition: opacity .4s; }
  /* ---- tarjeta: libro cerrado al pasar el cursor ---- */
  #tapa { position: fixed; z-index: 8; width: 210px; pointer-events: none; opacity: 0; transform: translateY(8px) scale(.92); transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.3); }
  #tapa.on { opacity: 1; transform: none; }
  #tapa.fijo { pointer-events: auto; }
  .cover { position: relative; aspect-ratio: 3 / 4; border-radius: 4px 12px 12px 4px; padding: 16px 14px 14px 22px; color: #fff8ea; display: flex; flex-direction: column; box-shadow: inset 7px 0 0 rgba(0,0,0,.22), inset 9px 0 0 rgba(255,255,255,.12), 0 18px 40px rgba(0,0,0,.55); overflow: hidden; }
  .cover::before { content: ''; position: absolute; inset: 8px 8px 8px 16px; border: 1.5px solid rgba(255,231,163,.75); border-radius: 3px 8px 8px 3px; pointer-events: none; }
  .cover::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 80% at 80% 0%, rgba(255,255,255,.18), transparent 55%); pointer-events: none; }
  .cover .em { font-size: 34px; margin: 6px 0 4px; text-align: center; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .cover .ti { font: 800 16px/1.2 Cinzel, serif; text-align: center; color: #ffe7a3; text-shadow: 0 2px 0 rgba(0,0,0,.3); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .cover .orn { height: 10px; margin: 8px auto; width: 60%; background: radial-gradient(circle, #f3cf73 0 2px, transparent 3px) center/12px 10px repeat-x; }
  .cover .au { margin-top: auto; text-align: center; font: 800 13px Nunito, sans-serif; color: #fff8ea; }
  .cover .au small { display: block; font-weight: 700; opacity: .8; font-size: 11px; margin-top: 2px; }
  .cover .th { width: 100%; height: 64px; object-fit: cover; border-radius: 6px; border: 2px solid rgba(255,231,163,.6); margin-top: 6px; }
  #tapa .hint { margin-top: 8px; text-align: center; font: 800 12px Nunito, sans-serif; color: #ffe7a3; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #tapa .abrir { display: none; margin: 8px auto 0; border: 0; border-radius: 999px; padding: 9px 16px; background: linear-gradient(180deg, #f3cf73, #b8862f); color: #2b1a0e; font: 900 14px Nunito, sans-serif; box-shadow: 0 4px 0 #6b4a1c; }
  #tapa.fijo .abrir { display: block; } #tapa.fijo .hint { display: none; }
  /* ---- libro abierto ---- */
  #libro { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(circle at 50% 40%, rgba(60,36,18,.55), rgba(10,6,3,.85)); }
  #libro.on { display: flex; animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .ab { position: relative; width: min(980px, 100%); max-height: calc(100vh - 32px); display: grid; grid-template-columns: 1fr 1fr; padding: 14px; border-radius: 14px; background: var(--c, #6b2f2f); box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 3px rgba(255,231,163,.5); perspective: 1800px; }
  .pg { position: relative; background: linear-gradient(90deg, #f7ecd4, #fff8ea 12%, #fff8ea 88%, #f0e2c4); padding: 26px 28px 22px; overflow: auto; min-height: 420px; color: #3b2414; }
  .pg.l { border-radius: 6px 0 0 6px; box-shadow: inset -18px 0 24px -14px rgba(90,60,30,.45); transform-origin: right center; animation: abrirL .9s cubic-bezier(.2,.8,.2,1); }
  .pg.r { border-radius: 0 6px 6px 0; box-shadow: inset 18px 0 24px -14px rgba(90,60,30,.45); }
  @keyframes abrirL { from { transform: rotateY(-100deg); opacity: .4; } }
  .pg::after { content: ''; position: absolute; left: 0; right: 0; bottom: 8px; height: 0; }
  .pg h2 { margin: 0 0 6px; font: 800 clamp(20px, 2.6vw, 30px)/1.15 Cinzel, serif; color: #6b2f2f; }
  .pg .cap { float: left; font: 900 64px/0.85 "Cinzel Decorative", serif; color: #b8862f; margin: 4px 8px 0 0; text-shadow: 2px 2px 0 #f3cf73; }
  .pg p { font-size: 16px; line-height: 1.55; margin: 0 0 12px; white-space: pre-wrap; }
  .pg .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .pg .meta span { padding: 4px 10px; border-radius: 999px; background: #f3e3c0; border: 1px solid #d9bd85; font-weight: 800; font-size: 13px; }
  .pg .autor { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 12px; border-top: 1.5px dashed #d9bd85; }
  .pg .autor i { width: 42px; height: 42px; border-radius: 50%; background: var(--c, #6b2f2f); color: #ffe7a3; display: grid; place-items: center; font: 900 16px Cinzel, serif; font-style: normal; }
  .pg .autor b { display: block; font-size: 16px; } .pg .autor small { color: #7a5a3a; font-weight: 700; }
  .pg img.foto { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; background: #f3e3c0; border: 2px solid #d9bd85; cursor: zoom-in; }
  .pg .ver { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 10px 16px; border-radius: 999px; background: #6b2f2f; color: #ffe7a3; font-weight: 900; text-decoration: none; }
  .pg h3.sub { clear: both; margin: 4px 0 8px; font: 800 15px Cinzel, serif; letter-spacing: .06em; color: #6b2f2f; } .pg p.fu { font-size: 14px; color: #5a4028; } .pg p.rvd { margin-top: 14px; font-weight: 800; color: #3d6b48; font-size: 14px; }
  .pg ol.pasos { margin: 10px 0 0; padding-left: 0; list-style: none; counter-reset: p; } .pg ol.pasos li { counter-increment: p; position: relative; padding: 0 0 14px 46px; font: 600 17px/1.5 Georgia, serif; }
  .pg ol.pasos li::before { content: counter(p, upper-roman) '.'; position: absolute; left: 0; top: -2px; font: 900 22px "Cinzel Decorative", Cinzel, serif; color: #7a2a22; }
  .pg.cen { display: grid; place-items: center; text-align: center; } .pg .marco { padding: 24px 22px; border: 3px double #b8923f; border-radius: 50% / 18%; max-width: 330px; } .pg .marco h2 { font-size: clamp(18px, 2.2vw, 24px); } .pg p.mini { font-size: 14px; color: #5a4028; margin-top: 10px; }
  .pgnav { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 999px; background: #3b2414; color: #ffe7a3; font: 800 13px Nunito, sans-serif; box-shadow: 0 6px 16px rgba(0,0,0,.4); z-index: 3; }
  .pgnav button { border: 0; border-radius: 999px; padding: 6px 12px; background: #f3cf73; color: #3b2414; font: 900 13px Nunito, sans-serif; } .pgnav button[disabled] { opacity: .35; }
  figure.anx { margin: 0 0 12px; } figure.anx figcaption { font: 800 12px Cinzel, serif; color: #7a5a3a; margin-top: 4px; text-align: center; }
  .pg p a { color: #1d4ed8; word-break: break-all; }
  .pg .pdf { display: inline-block; margin-top: 12px; margin-right: 8px; border: 1.5px solid #c99a45; border-radius: 999px; padding: 6px 12px; background: #fff7e6; color: #6b2f2f; font: 900 12.5px Nunito, sans-serif; cursor: pointer; } .pg .pdf:hover { background: #fdecc8; }
  .pg .borrar { display: inline-block !important; } .pg .borrar { display: block; margin-top: 14px; border: 0; border-radius: 999px; padding: 8px 16px; background: #9b2c2c; color: #fff3e0; font: 900 13px Nunito, sans-serif; cursor: pointer; box-shadow: 0 3px 0 #5e1717; } .pg .borrar:hover { background: #b33636; } .pg .borrar[disabled] { opacity: .6; cursor: wait; }
  .pg .sello { position: absolute; right: 18px; bottom: 14px; font: 800 11px Cinzel, serif; letter-spacing: .2em; color: #b8862f; opacity: .8; }
  @media (min-width: 721px) { .ab { height: min(calc(100vh - 32px), calc(min(980px, 100vw - 32px) * .68)); max-height: none; } .ab .pg { min-height: 0; } }   /* en PC: forma de libro (no se estira hacia abajo); cada página baja con su barrita */
  .ab .cerrar { position: absolute; right: -10px; top: -12px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #3b2414; background: #f3cf73; color: #3b2414; font: 900 18px system-ui; box-shadow: 0 4px 0 #3b2414; z-index: 2; }
  @media (max-width: 720px) { .ab { grid-template-columns: 1fr; overflow: auto; } .pg { min-height: 0; } .pg.l { border-radius: 6px 6px 0 0; transform-origin: center top; } .pg.r { border-radius: 0 0 6px 6px; } @keyframes abrirL { from { transform: rotateX(80deg); } } }
  /* ---- cargando ---- */
  #carga { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #5a3a1e, #1c0f06); color: #f6e2b3; transition: opacity .8s; }
  #carga div { text-align: center; font: 800 16px Cinzel, serif; letter-spacing: .2em; }
  #carga span { display: block; font-size: 46px; margin-bottom: 10px; animation: flot 1.6s ease-in-out infinite; }
  @keyframes flot { 50% { transform: translateY(-10px) rotate(-4deg); } }
  #aviso { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 6; padding: 10px 18px; border-radius: 999px; background: rgba(43,26,14,.86); border: 2px solid rgba(233,196,106,.7); color: #f6e2b3; font: 800 14px Nunito, sans-serif; text-align: center; opacity: 0; transition: opacity .4s; pointer-events: none; max-width: calc(100vw - 24px); }
  #aviso.on { opacity: 1; }
  @media (max-width: 600px) { #titulo { top: 62px; } }
  @media (max-width: 600px) { #bar button { padding: 8px 10px; font-size: 12px; } #bar .nav { width: 36px; height: 36px; } #tapa { width: 170px; } }
  @media (max-height: 500px) {                                        /* celular acostado: la barra de abajo más delgada */
    #bar { bottom: max(6px, env(safe-area-inset-bottom)); padding: 3px 5px; gap: 4px; border-width: 1.5px; }
    #bar .g { gap: 2px; } #bar button { padding: 4px 9px; font-size: 11px; gap: 4px; } #bar button i { min-width: 17px; height: 17px; font-size: 10px; padding: 0 4px; }
    #bar .nav { width: 28px; height: 28px; font-size: 13px; } #pisos { bottom: calc(max(6px, env(safe-area-inset-bottom)) + 42px); padding: 4px; } #pisos button { padding: 5px 12px; font-size: 12px; } #aviso { bottom: 52px; font-size: 13px; padding: 7px 14px; }
    #volver { font-size: 13px; padding: 6px 12px; } #editar { height: 34px; font-size: 13px; padding: 0 10px; right: calc(max(10px, env(safe-area-inset-right)) + 84px); }
    #pcompleta, #sonido { width: 34px; height: 34px; } #pcompleta { right: calc(max(10px, env(safe-area-inset-right)) + 42px); } }
  /* 🤖 Molí en la Biblioteca: su globito con el mini buscador */
  #mGlobo { position: fixed; left: 0; top: 0; z-index: 8; width: min(360px, calc(100vw - 24px)); padding: 14px 16px 12px; border-radius: 20px; background: #fffaf0; border: 3px solid #3b2414; box-shadow: 0 8px 0 rgba(59,36,20,.35), 0 18px 40px rgba(0,0,0,.4); font: 700 15px Nunito, system-ui, sans-serif; color: #3b2414; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #mGlobo.on { opacity: 1; pointer-events: auto; } #mGlobo::after { content: ''; position: absolute; left: var(--tail, 40px); bottom: -14px; width: 22px; height: 22px; background: #fffaf0; border-right: 3px solid #3b2414; border-bottom: 3px solid #3b2414; transform: rotate(45deg); }
  #mGlobo b.t { display: block; font: 900 17px Cinzel, Georgia, serif; color: #6b2f2f; margin-bottom: 4px; } #mGlobo .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; font-size: 18px; cursor: pointer; color: #6b2f2f; }
