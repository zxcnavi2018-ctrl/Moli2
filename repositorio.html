<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repositorio Educativo · Molí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2e4f;--blue:#0a6aa1;--blue2:#1583c4;--sky:#e7f2fa;--green:#8cc63f;--green2:#6aa52b;--mint:#eef8e3;--cream:#fbfaf6;--ink:#17324d;--ink2:#4b6075;--line:#d9e4ee;--gold:#f5b62a;--red:#e2483d;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
/* encabezado */
.top{position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px 12px;color:#fff;background:linear-gradient(115deg,var(--navy) 0%,var(--blue) 62%,#1a8bc9 100%);overflow:hidden;flex:none}
.top::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(140,198,63,.55),rgba(140,198,63,0) 68%);pointer-events:none}
.top .moli{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));flex:none;animation:bob 3s ease-in-out infinite}
.brand{flex:1;min-width:0}
.brand small{display:block;font-weight:900;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#cfe8a7}
.brand h1{margin:2px 0 0;font:900 clamp(22px,3.2vw,34px)/1.05 var(--serif);letter-spacing:.01em}
.me{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:800;font-size:13px;white-space:nowrap}
.me i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--navy);font-style:normal;font-weight:900}
.me .rol{padding:2px 8px;border-radius:999px;background:var(--gold);color:#3b2a00;font-size:11px;font-weight:900}
/* equipo de la revista: organigrama */
.eq-h{text-align:center;margin:4px 0 18px}.eq-h h2{margin:0;font:900 clamp(26px,4vw,38px)/1.1 var(--serif);color:var(--navy)}.eq-h p{margin:6px auto 0;max-width:620px;font-weight:700;color:var(--ink2)}
.org{display:flex;flex-direction:column;align-items:center}
.org .lvl{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
.org .ln{width:4px;height:28px;background:var(--line);border-radius:4px}
.org .rama{position:relative;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:24px}
.org .rama::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:4px;background:var(--line);border-radius:4px}
.org .sec{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px;border-radius:20px;background:#fff;border:2px solid var(--line)}
.org .sec::before{content:"";position:absolute;top:-24px;left:50%;width:4px;height:24px;margin-left:-2px;background:var(--line)}
.org .sec>b{padding:4px 14px;border-radius:999px;background:var(--navy);color:#fff;font-weight:900;font-size:14px}
.pc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;width:100%;max-width:330px;padding:16px 14px 14px;border-radius:20px;background:#fff;border:3px solid var(--line);box-shadow:0 10px 24px -16px rgba(11,46,79,.5)}
.pc .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:900 24px var(--serif);color:#fff;background:linear-gradient(135deg,var(--blue),var(--navy));box-shadow:0 0 0 4px #fff,0 0 0 7px var(--gold)}
.pc h4{margin:6px 0 0;font:900 17px/1.2 var(--serif);color:var(--navy)}
.pc .cg{padding:3px 12px;border-radius:999px;background:var(--gold);color:#3b2a00;font-weight:900;font-size:12px;letter-spacing:.04em}
.pc ul{margin:6px 0 0;padding:0;list-style:none;text-align:left;font-size:13px;font-weight:700;color:var(--ink2);display:grid;gap:3px}
.pc .nr{margin-top:4px;font-size:12px;font-weight:900;color:var(--green2)}
.pc.doc{max-width:420px;border-color:var(--gold);background:linear-gradient(180deg,#fffbeb,#fff)}.pc.doc .av{width:78px;height:78px;font-size:30px}
.pc.rc{border-color:#bfdbfe}.pc.rc .av{background:linear-gradient(135deg,#22c55e,#0a6aa1)}.pc.rc .cg{background:#dbeafe;color:#1e3a8a}
.pc.vac{border-style:dashed;background:#f8fafc;box-shadow:none}.pc.vac .av{background:#e2e8f0;color:#94a3b8;box-shadow:0 0 0 4px #fff,0 0 0 7px #e2e8f0}.pc.vac h4{color:#94a3b8}
.pc.aut{max-width:640px;border-color:#d4ecb8;background:var(--mint)}.pc.aut .av{background:linear-gradient(135deg,var(--green),var(--green2))}.pc.aut .cg{background:var(--green);color:var(--navy)}
.pc.mini{padding:10px 8px;gap:3px}.pc.mini .av{width:44px;height:44px;font-size:17px}.pc.mini h4{font-size:15px;margin-top:4px}.pc.mini .cg{font-size:11px}
.rc-fn{margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 14px;border-radius:18px;background:#eff6ff;border:2px solid #bfdbfe;max-width:900px}.rc-fn b{width:100%;text-align:center;font:900 16px var(--serif);color:var(--navy)}.rc-fn span{padding:5px 11px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;color:#1e3a8a}
.eq-fn{margin:24px auto 0;max-width:900px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.eq-fn div{padding:14px;border-radius:18px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--ink2)}.eq-fn b{display:block;font:900 17px var(--serif);color:var(--navy);margin-bottom:4px}
@media (max-width:820px){.org .rama{grid-template-columns:repeat(2,minmax(0,1fr));padding-top:0}.org .rama::before,.org .sec::before{display:none}.eq-fn{grid-template-columns:1fr}}
/* 🔎 Similitud (tipo Turnitin) */
.sm-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}.sm-h h2{margin:0;flex:1;font:900 clamp(24px,3.4vw,34px)/1.1 var(--serif);color:var(--navy)}
.sm-l{display:grid;gap:10px}
.sm-r{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;border:2px solid var(--line)}
.sm-r .ic{font-size:30px;flex:none}.sm-r .t{flex:1;min-width:0}.sm-r .t b{display:block;font:800 17px/1.2 var(--serif);color:var(--navy)}.sm-r .t span{font-size:13px;font-weight:800;color:var(--ink2)}
.sm-p{padding:6px 12px;border-radius:999px;font-weight:900;font-size:13px;white-space:nowrap;background:#f1f5f9;color:#64748b}
.sm-p.v0{background:var(--mint);color:var(--green2)}.sm-p.v1{background:#fef9c3;color:#854d0e}.sm-p.v2{background:#ffedd5;color:#9a3412}.sm-p.v3{background:#fde8e6;color:#b23a30}.sm-p.ac{background:#e0f2fe;color:#075985}
.sm-r .btn{padding:10px 16px;font-size:14px}
.sm-scan{padding:34px 20px;text-align:center}.sm-scan .bk{font-size:64px;animation:smB .6s ease-in-out infinite alternate}.sm-scan b{display:block;margin-top:8px;font:900 22px var(--serif);color:var(--navy)}.sm-scan span{display:block;min-height:22px;margin-top:6px;font-weight:800;color:var(--ink2)}
.sm-bar{height:12px;margin:16px auto 0;max-width:420px;border-radius:99px;background:var(--line);overflow:hidden}.sm-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue2));transition:width .12s}
@keyframes smB{to{transform:translateY(-8px) rotate(-6deg)}}
.sm-top{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:16px;border-radius:20px;background:#fff;border:2px solid var(--line)}
.sm-ring{--p:0;--c:var(--green2);width:118px;height:118px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e5edf3 0)}
.sm-ring>div{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1}.sm-ring b{font:900 30px var(--serif);color:var(--navy)}.sm-ring small{display:block;font-size:11px;font-weight:900;color:var(--ink2)}
.sm-v{flex:1;min-width:220px}.sm-v h3{margin:0 0 4px;font:900 22px/1.15 var(--serif)}.sm-v p{margin:0;font-weight:700;color:var(--ink2)}
.sm-v.v0 h3{color:var(--green2)}.sm-v.v1 h3{color:#a16207}.sm-v.v2 h3{color:#c2410c}.sm-v.v3 h3{color:var(--red)}
.sm-src{display:grid;gap:8px}
.sm-s{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:left}
.sm-s.on{border-color:var(--navy);box-shadow:0 0 0 3px #cfe3f3}.sm-s .cl{width:16px;height:16px;border-radius:5px;flex:none}.sm-s .t{flex:1;min-width:0;font-weight:800;font-size:14px}.sm-s .t small{display:block;font-weight:700;color:var(--ink2)}.sm-s em{font-style:normal;font:900 20px var(--serif);color:var(--navy)}
.sm-cmp{display:grid;grid-template-columns:1fr;gap:12px}.sm-cmp.dos{grid-template-columns:1fr 1fr}
.sm-tx{padding:14px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:15px;line-height:1.6;white-space:pre-wrap;max-height:52vh;overflow:auto}
.sm-tx h5{margin:0 0 8px;font:900 14px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:normal}
.sm-tx mark{border-radius:4px;padding:0 2px;color:inherit}.sm-tx mark.dim{opacity:.35}
.c0{background:#fecaca}.c1{background:#fde68a}.c2{background:#bfdbfe}.c3{background:#ddd6fe}.c4{background:#bbf7d0}.c5{background:#fbcfe8}
.sm-web{padding:14px 16px;border-radius:18px;background:#faf5ff;border:2px solid #e9d5ff}.sm-web h4{margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sm-wh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #e9d5ff}.sm-wh q{flex:1;min-width:220px;font-size:14px;font-weight:700;color:var(--ink)}.sm-wh .btn{padding:8px 14px;font-size:13px;text-decoration:none}
.sm-wl{margin:4px 0;font-weight:700;color:var(--ink2);font-size:14px}.sm-web summary{cursor:pointer;font-weight:900;color:#6b21a8;padding:6px 0}
.sm-tx mark.cw{background:#e9d5ff;text-decoration:underline wavy #9333ea}
.sm-ia{padding:14px 16px;border-radius:18px;background:#fff7ed;border:2px solid #fed7aa}.sm-ia h4{margin:0 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sm-ip{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.sm-ip span{padding:8px 12px;border-radius:14px;background:#fff;border:2px solid #fed7aa;font-size:13.5px;font-weight:800;color:var(--ink)}.sm-ip small{display:block;margin-top:2px;font-weight:700;color:#9a3412}
.sm-ia summary{cursor:pointer;font-weight:900;color:#c2410c;padding:6px 0}.sm-ia .sm-tx{max-height:40vh}
.sm-tx mark.ci{background:#fed7aa;border-bottom:2px dotted #ea580c}
.sm-lim{width:100%;margin:2px 0;padding:10px 12px;border-radius:14px;font-weight:800;font-size:14px}.sm-lim.no{background:#fde8e6;color:#9b2c22}.sm-lim.ok{background:var(--mint);color:var(--green2)}
.sm-met{height:10px;margin:4px 0 8px;border-radius:99px;background:#ffedd5;overflow:hidden}.sm-met i{display:block;height:100%;background:linear-gradient(90deg,#fdba74,#dc2626)}
.sm-pr{display:grid;gap:6px;margin:8px 0;padding:10px 12px;border-radius:14px;background:#fff;border:2px dashed #fdba74;font-size:14px;font-weight:700}.sm-pr b{color:#9a3412}
.sm-ley{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:800;color:var(--ink2)}
@media (max-width:720px){.sm-cmp.dos{grid-template-columns:1fr}.sm-r{flex-wrap:wrap}}
/* ✍️ hoja tipo Word */
#hoja{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#e6e6e6;font-family:Carlito,Calibri,"Segoe UI",Arial,sans-serif;color:#222}#hoja[hidden]{display:none}
.wd-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#2b579a;color:#fff;flex:none}.wd-bar b{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd-w{display:grid;place-items:center;width:28px;height:28px;border-radius:5px;background:#fff;color:#2b579a;font:900 17px Georgia,serif}.wd-sv{font-size:13px;opacity:.9;white-space:nowrap}
.wd-ok{padding:8px 16px;border:0;border-radius:8px;background:#8cc63f;color:#123000;font-weight:900;font-size:14px}.wd-x{width:34px;height:34px;border:0;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-size:17px;font-weight:900}
.wd-rib{display:flex;align-items:center;gap:14px;padding:7px 14px;background:#f3f3f3;border-bottom:1px solid #d4d4d4;font-size:13px;color:#444;overflow-x:auto;white-space:nowrap;flex:none;scrollbar-width:none}
.wd-rib .on{color:#2b579a;font-weight:700;border-bottom:2px solid #2b579a;padding-bottom:2px}.wd-rib i{width:1px;height:18px;background:#ccc}.wd-f{padding:2px 8px;border:1px solid #ccc;border-radius:3px;background:#fff}.wd-rib b,.wd-rib em,.wd-rib u{font-family:Georgia,serif;color:#666}
.wd-np{padding:2px 9px;border-radius:999px;background:#fde8e6;color:#b23a30;font-weight:700}
.wd-sc{flex:1;overflow:auto;padding:24px 12px 40px}
.wd-pg{max-width:794px;min-height:1000px;margin:0 auto;padding:64px 72px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.08);font-size:16px;line-height:1.5}
.wd-k{margin:0;font-size:11px;letter-spacing:.2em;color:#2b579a;font-weight:700}.wd-pg h1{margin:4px 0 2px;font:700 30px Cambria,Georgia,serif;color:#1f3864}.wd-sub{margin:0 0 18px;color:#555;font-size:14.5px}
.wd-tt label,.wd-pg h3{display:block;margin:12px 0 2px;font-weight:700;font-size:14px;color:#2b579a}
.wd-tt input{width:100%;padding:4px 0;border:0;border-bottom:2px solid #c9d6ea;font:700 22px Cambria,Georgia,serif;color:#1f3864;outline:0}.wd-tt input:focus{border-bottom-color:#2b579a}
.wd-ps{margin-top:22px}.wd-ps h2{margin:0;padding-bottom:4px;border-bottom:1px solid #8eaadb;font:700 19px Cambria,Georgia,serif;color:#1f3864}.wd-ps h2 span{display:inline-block;margin-right:6px;padding:1px 9px;border-radius:4px;background:#2b579a;color:#fff;font:700 12px/1.6 Calibri,Arial,sans-serif;letter-spacing:.06em;vertical-align:3px}
.wd-h{margin:6px 0 4px;font-size:13.5px;font-style:italic;color:#777}
.wd-cnt{margin:3px 0 10px;text-align:right;font:700 12.5px/1.3 Arial,sans-serif;color:#b45309}.wd-cnt.ok{color:#15803d}.wd-cnt.cero{color:#8a94a6;font-weight:600}
.wd-pg .wd-ed{display:block;width:100%;min-height:52px;padding:6px 8px;border:1px dashed transparent;border-left:3px solid #dbe5f3;border-radius:2px;background:transparent;font:inherit;line-height:1.55;resize:none;overflow:hidden;outline:0}
.wd-pg .wd-ed:hover{border-color:#dde4ee}.wd-pg .wd-ed:focus{border-color:#9fb6d9;border-left-color:#2b579a;background:#fbfcfe}
.wd-fu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}.wd-fu table{width:100%;border-collapse:collapse;font-size:13.5px}
.wd-fu caption{text-align:left;padding:3px 8px;background:#2b579a;color:#fff;font-weight:700}.wd-fu th{width:40%;padding:4px 6px;border:1px solid #b4c6e7;background:#f2f6fc;text-align:left;font-weight:700;color:#1f3864;vertical-align:top}.wd-fu th small{display:block;font-weight:600;color:#2e7d32}
.wd-fu td{border:1px solid #b4c6e7;padding:0}.wd-fu input{width:100%;padding:5px 6px;border:0;font:inherit;outline:0;background:transparent}.wd-fu input:focus{background:#fbfcfe;box-shadow:inset 0 0 0 2px #9fb6d9}.wd-fu input[data-link]{color:#0563c1;text-decoration:underline}
.wd-pre{display:flex;align-items:flex-start;gap:8px;margin:4px 0}.wd-pre b{flex:none;padding-top:7px;color:#1f3864}.wd-pre .wd-ed{flex:1;min-height:36px}.wd-pre input{flex:1;padding:6px 8px;border:0;border-bottom:1px dashed #b4c6e7;font:inherit;outline:0}
.wd-tb{width:100%;margin-top:6px;border-collapse:collapse;font-size:14px}.wd-tb th{padding:5px 8px;border:1px solid #b4c6e7;background:#f2f6fc;color:#1f3864}.wd-tb td{border:1px solid #b4c6e7;padding:0}.wd-tb input{width:100%;padding:6px;border:0;font:inherit;outline:0;text-align:center}
.wd-ro{margin:0 0 14px;padding:10px 12px;border-radius:6px;background:#e8f0fb;color:#1f3864;font-weight:700;font-size:14px}
.g-doc small b{display:inline!important}
.wd-2{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}.wd-go.env{border-color:#6aa52b}.wd-go.env .ic{background:#6aa52b;font-size:22px}@media (max-width:720px){.wd-2{grid-template-columns:1fr}}
#wdDlg{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,26,45,.55)}#wdDlg[hidden]{display:none}
.wd-dc{width:min(460px,100%);display:grid;gap:10px;padding:20px;border-radius:20px;background:#fff;border:3px solid #2b579a;box-shadow:0 24px 60px rgba(0,0,0,.4)}.wd-dc>b{font:900 21px var(--serif);color:var(--navy)}.wd-dc>span{font-weight:700;color:var(--ink2)}
.wd-dc input{padding:12px 14px;border:2px solid var(--line);border-radius:14px;font-weight:800;font-size:16px}.wd-dc>div{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.wd-e{margin:0;font-weight:800;color:var(--ink2)}
.wd-dc .wd-ls{display:grid;justify-content:stretch;gap:8px;max-height:50vh;overflow:auto}.wd-ls button{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer}.wd-ls button:hover{border-color:#2b579a}.wd-ls i{display:grid;place-items:center;width:36px;height:42px;border-radius:6px;background:#2b579a;color:#fff;font:900 18px Georgia,serif;font-style:normal}.wd-ls b{display:block;color:var(--navy)}.wd-ls small{font-weight:800;color:var(--ink2)}
.wd-ed{cursor:text;word-break:break-word;white-space:pre-wrap}.wd-ed:empty:before{content:attr(data-ph);color:#9aa5b1;pointer-events:none}.wd-ed[contenteditable=false]{cursor:default}
.wd-fm{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;color:#333;font:600 13px Carlito,Calibri,Arial,sans-serif;cursor:pointer}.wd-fm:hover{background:#e8eefb;border-color:#2b579a}.wd-fm b{font:900 15px Georgia,serif}.wd-fm.mk span{display:inline-block;padding:0 3px;border-radius:3px;background:#fff176}
.wd-kw input{font:600 16px Carlito,Calibri,Arial,sans-serif;color:#222}.wd-tt label small{font-weight:600;color:#888}
.wd-ed .rvm{background:#fde047;border-radius:2px}.wd-ed .rvs{background:#fdba74;border-radius:2px}.wd-ed .rvm.rvs{background:linear-gradient(#fde047 55%,#fdba74 55%)}.wd-ed .rvo{text-decoration:underline wavy #2563eb;text-underline-offset:3px}.wd-ed [data-n]::after{content:attr(data-n);display:inline-grid;place-items:center;min-width:16px;height:16px;margin-left:2px;border-radius:50%;background:#ca8a04;color:#fff;font:800 10px/1 Arial,sans-serif;vertical-align:super}

body:not(.docente) #modal .art:not(.rv-art) .bd > p { -webkit-user-select: none; user-select: none; }
/* pestañas */
.tabs{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;display:flex;align-items:center;gap:8px;padding:11px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;font-weight:900;font-size:15px;color:var(--ink2);white-space:nowrap;transition:all .2s}
.tabs button:hover{border-color:var(--blue2);color:var(--blue)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 16px -6px rgba(11,46,79,.6)}
.tabs button .cnt{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center}
.tabs button[hidden],.tabs button .cnt[hidden]{display:none}
main{flex:1;overflow:auto;padding:18px 20px 40px;scroll-behavior:smooth}
.wrap{max-width:1100px;margin:0 auto}
/* globo de Molí */
.tip{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px 16px;border-radius:18px;background:var(--sky);border:2px solid #cfe3f3;font-weight:800;color:var(--navy)}
.tip img{width:46px;height:46px;object-fit:contain;flex:none}
.tip.green{background:var(--mint);border-color:#d4ecb8}
/* portada de la revista */
.cover{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;padding:24px 26px;border-radius:24px;color:#fff;background:linear-gradient(130deg,var(--navy),var(--blue) 70%);overflow:hidden;margin-bottom:16px}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 18px);pointer-events:none}

.cover h2{margin:4px 0 6px;font:900 clamp(30px,5vw,54px)/1 var(--serif)}
.cover h2 em{font-style:normal;color:var(--green)}
.cover p{margin:0;max-width:560px;font-weight:700;opacity:.92}
.cover img{width:clamp(80px,12vw,130px);filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));position:relative}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:14px;color:var(--ink2)}

.card{display:flex;flex-direction:column;text-align:left;padding:0;border:0;border-radius:20px;background:#fff;box-shadow:0 2px 0 var(--line),0 10px 24px -14px rgba(11,46,79,.45);overflow:hidden;transition:transform .2s,box-shadow .2s}

/* fuentes */

.tr-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tr-slots .sl{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;padding:7px 9px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font:700 12.5px var(--sans);color:#334155}

.tr-slots .sl.ok{border-color:#86efac;background:#f0fdf4}.tr-slots .sl.mj{border-color:#fdba74;background:#fff7ed}.tr-slots .sl.rv{border-color:#93c5fd;background:#eff6ff}.tr-slots .sl.pe{border-style:dashed;background:#f8fafc;color:#94a3b8}
.tr-r .tr-st{min-width:84px}
.pq{margin:2px 0 6px;font:italic 700 16px/1.4 var(--serif);color:#0f4c81}.feat .pq{font-size:19px}.card .pq{font-size:14px;margin:0 0 4px}.res .pq{font-size:14.5px;margin:2px 0 4px}
.pdfb{justify-self:start;padding:6px 12px!important;font-size:13px!important}
.tyw{display:inline-flex;align-items:center;gap:3px}.opts button.lock{opacity:.5;cursor:not-allowed;background:#f1f5f9}
.opts .tlk{padding:6px 8px;border-radius:10px;border:2px dashed #94a3b8;font-size:14px;background:#fff}.opts .tlk.on{border:2px solid #dc2626;background:#fee2e2}
.photo{display:flex;align-items:center;gap:12px;padding:12px;border:2px dashed #b9d3e8;border-radius:16px;background:#fff;font-weight:800;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border:0;border-radius:16px;font-weight:900;font-size:16px;transition:transform .15s,filter .15s}

.mine{display:grid;gap:10px;margin-top:22px;max-width:760px}
.mine h3{margin:0;font:900 20px var(--serif);color:var(--navy)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.row .t{flex:1;min-width:0}

.row .t span{font-size:13px;font-weight:700;color:var(--ink2)}

.st.pend{background:#fff4d6;color:#8a6100}.st.ok{background:var(--mint);color:var(--green2)}.st.no{background:#fde8e6;color:#b23a30}

async function pbkdf(pass, salt, iter, bits) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(salt), iterations: iter }, k, bits);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

}

  'Enfermedades que no se contagian': { q: '¿La diabetes y la obesidad se contagian?',

    h3: 'Para prevenir estas enfermedades debemos comer frutas y verduras, tomar agua en lugar de gaseosas y hacer ejercicio todos los días, por lo menos una hora jugando o haciendo deporte. También es bueno dormir de 9 a 11 horas, comer menos golosinas y comida chatarra, y pasar menos tiempo frente a las pantallas (Pérez, 2021).',

    h3: 'Otras enfermedades se pasan por la saliva o por el contacto con la piel o con objetos que tocó una persona enferma, como la varicela. Por eso no debemos compartir vasos ni cubiertos. Además, es importante lavarnos las manos con agua y jabón después de tocar cosas en lugares públicos (Gómez, 2020).',

  '¿El dengue es una enfermedad contagiosa?': { q: '¿El dengue se contagia de persona a persona?',
    h1: 'Según el Ministerio de Salud (2024), el dengue es causado por un virus que transmite el zancudo Aedes aegypti cuando pica a una persona. Produce fiebre alta, dolor de cabeza y dolor en los huesos. En el Perú hay más casos en las zonas cálidas, sobre todo en verano y en épocas de lluvia.',

  'La importancia de las bacterias': { q: '¿Para qué sirven las bacterias?',

    h2: 'Según la Universidad Nacional (2021), algunas bacterias ayudan a hacer el yogur y el queso, porque transforman el azúcar de la leche en un ácido que la vuelve espesa y le da un sabor agrio. Otras bacterias se usan para fabricar medicinas, como la insulina, e incluso para limpiar el agua sucia en las plantas de tratamiento.',
    h3: 'Las bacterias del suelo descomponen las hojas y los animales muertos, y devuelven nutrientes a las plantas. Sin ellas, la basura natural se acumularía y el suelo no sería fértil. Algunas, incluso, viven en las raíces de plantas como los frijoles y les dan el nitrógeno que necesitan para crecer (Ramírez, 2022).',
    r: 'Después de leer al Instituto Nacional de Salud, a la Universidad Nacional y a Ramírez, concluyo que las bacterias son muy importantes. Nos ayudan a digerir, sirven para preparar alimentos como el yogur y limpian el suelo; sólo algunas causan enfermedades. Por eso no debemos pensar que todas las bacterias son malas, ya que sin ellas no podríamos vivir.', f: [F3('Universidad Nacional', '2021', 'Bacterias en los alimentos', ''), F3('Ramírez', '2022', 'Bacterias del suelo', ''), F3('Instituto Nacional de Salud', '2022', 'Bacterias útiles y dañinas', '')] },

    h2: 'Estas bacterias también nos defienden de las bacterias malas, porque ocupan su espacio y se comen sus alimentos. Así, a las bacterias dañinas les cuesta más crecer y enfermarnos. Para cuidarlas, debemos comer todos los días frutas, verduras, menestras y otros alimentos con fibra, y también yogur natural sin azúcar (Universidad Nacional, 2021).',
    h3: 'Cuando tomamos antibióticos sin receta del médico, podemos matar también a las bacterias buenas de nuestro intestino. Entonces nos puede doler el estómago o dar diarrea, y nuestras defensas se debilitan. Por eso sólo debemos tomarlos cuando el médico los receta, y siempre por los días exactos que él nos indique (López, 2023).',
    r: 'Después de leer al Instituto Nacional de Salud, a la Universidad Nacional y a López, concluyo que en nuestro cuerpo viven bacterias buenas que nos ayudan a digerir, producen vitaminas y nos defienden. Por eso no debemos tomar antibióticos sin receta. También debemos comer frutas, verduras y alimentos con fibra para cuidar a estas bacterias que nos mantienen sanos.', f: [F3('Instituto Nacional de Salud', '2022', 'La microbiota intestinal', ''), F3('Universidad Nacional', '2021', 'Bacterias que nos defienden', ''), F3('López', '2023', 'Uso de antibióticos', '')] } };

    <aside class="rv-side"><section><h4>💬 Comentarios ${by ? 'de ' + esc(by) : ''}</h4>${cm.length ? cm.map(x => `<div class="rv-c"><b>${D.num[x.k]}</b><div><q>${esc(w.d.slice(x.a, x.b).slice(0, 60))}</q><p>${esc(x.c)}</p></div></div>`).join('') : `<p class="rv-f">${m.length ? '🟨 Mira las partes subrayadas en amarillo.' : 'Tu Revisor no dejó marcas.'}</p>`}</section>
    ${w.st === 'no' ? '<section><p class="rv-f">✏️ Corrige tu guía: en 📁 Word Molí toca «👀 Ver» y luego «Hacer una copia para corregir». Después vuelve a enviarla.</p></section>' : ''}</aside></div></article>`;
}
window.verRevision = verRevision;

// ---- ver un trabajo (artículo de la revista o revisión) ----
async function bajarWord(id, b) {                                     // el Word que subió el estudiante (sólo la profe y los Revisores)
  const t0 = b.textContent; b.disabled = true; b.textContent = '⏳ Buscando el Word…';
  try { const a = await staffTok(); if (!a) throw new Error('AUTH');
    const r = await fetch(`${BASE}/revdoc/${encodeURIComponent(id)}?key=${F.apiKey}`, { headers: { Authorization: 'Bearer ' + a } });
    if (r.status === 404) throw new Error('NO'); if (!r.ok) throw new Error(r.status === 403 ? 'AUTH' : 'NET');
    const j = await r.json(), b64 = j.fields.b64.stringValue, n = (j.fields.n || {}).stringValue || 'trabajo.docx';
    const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
    const l = document.createElement('a'); l.href = url; l.download = n; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (x) { toast(x.message === 'NO' ? '📄 Este trabajo se envió sin el Word (fue antes de este cambio o el archivo era muy grande).' : x.message === 'AUTH' ? '🔐 Conecta tu cuenta para descargar el Word.' : '📶 No pude bajar el Word. Revisa tu internet.', 5000); }
  b.disabled = false; b.textContent = t0;
}
// ✨ a un trabajo ya publicado (p. ej. enviado en Word antes de esto) se le agrega su Resumen y Abstract.
//    Las reglas no dejan cambiar el texto de un trabajo: se crea una copia nueva con todo igual y luego se borra la vieja.
async function resumenPublicado(id, bt) {
  const t0 = bt.textContent; bt.disabled = true; bt.textContent = '✨ Molí está escribiendo…';
  try { const a = await staffTok(); if (!a) throw new Error('AUTHT');
    const w = await getDoc(id); if (!w || w.st !== 'ok') throw new Error('NET');
    const R = await resumenIA(w.t, w.d), C = ['k', 'n', 'sec', 'u', 'ty', 't', 'd', 'f', 'link', 'th', 'img', 'img2', 'img3', 'st', 'at', 'rv', 'rvAt', 'g', 'kw'], o = {};
    C.forEach(k => { if (w[k] != null && w[k] !== '') o[k] = w[k]; }); o.d = conResumen(w.d, R); ['at', 'rvAt'].forEach(k => { if (o[k]) o[k] = new Date(o[k]); });
    const nid = w.k + '-' + Date.now().toString(36), h = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + a };
    const r = await fetch(`${BASE}/revista/${encodeURIComponent(nid)}?key=${F.apiKey}&currentDocument.exists=false`, { method: 'PATCH', headers: h, body: JSON.stringify({ fields: fieldsOf(o) }) });
    if (!r.ok) throw new Error(r.status === 403 ? 'AUTH' : 'NET');
    await fetch(`${BASE}/revista/${encodeURIComponent(id)}?key=${F.apiKey}`, { method: 'DELETE', headers: h });
    CACHE.ok = null; $('#modal').hidden = true; $('#modal').innerHTML = ''; await vRevista(); openArt(nid);
    toast('✨ Listo: su PDF ya trae el Resumen.', 4500);
  } catch (x) { bt.disabled = false; bt.textContent = t0; toast(x.message === 'IA' ? '🤖 Molí no pudo ahora. Intenta en un minuto.' : x.message === 'AUTHT' || x.message === 'AUTH' ? '🔐 Conecta tu cuenta de docente en el aula (fotocheck → Conectar mi cuenta).' : '📶 No se pudo. Revisa tu internet.', 4500); }
}
async function openArt(id) {
  const M = $('#modal'); M.hidden = false; M.innerHTML = '<div class="art"><div class="load">📖 Abriendo…</div></div>';
  let w = [...(CACHE.ok || []), ...(CACHE.pend || [])].find(x => x.id === id);
  try { const full = await getDoc(id); if (full) w = full; } catch (e) {}
  if (!w) { M.hidden = true; return toast('No encontré ese trabajo.'); }
  const staff = ROLE.t && TAB === 'bandeja' && w.st === 'pend', rvVer = ROLE.r && !ROLE.t && TAB === 'bandeja' && w.st === 'pend', own = ME && w.k === ME.key, link = safeUrl(w.link), t = tipo(w.ty);
  M.innerHTML = `<article class="art" role="dialog" aria-modal="true"><div class="hero"><small>${t[1]} ${t[2]} · ${unidad(w.u)[1]} ${esc(unidad(w.u)[2])}</small><h2>${esc(w.t)}</h2><div class="by">✍️ ${esc(w.n)} · ${esc(gtx(w) + (w.sec ? ' ' + w.sec : ''))} · ${fecha(w.at)}</div><button type="button" class="x" data-x aria-label="Cerrar">✕</button></div>
  <div class="bd"><p>${esc(w.d)}</p>${[w.img, w.img2, w.img3].filter(Boolean).length ? `<h4>📎 Anexos</h4><div class="anx">${[w.img, w.img2, w.img3].filter(Boolean).map((x, i) => `<figure><img src="${esc(x)}" alt="Anexo ${i + 1}"><figcaption>Anexo ${i + 1}</figcaption></figure>`).join('')}</div>` : ''}${w.f ? `<h4>📚 Fuentes</h4><p style="font-size:14.5px">${esc(w.f)}</p>` : ''}
 ${ROLE.t ? '<button type="button" class="btn blue" data-word style="justify-self:start">📄 Descargar su Word</button>' : ''}
  ${rvVer ? `<div class="acts"><p style="margin:0;padding:12px 16px;border-radius:16px;background:var(--sky);font-weight:800;color:var(--navy)">👀 Aquí sólo lo lees. Para revisarlo, ábrelo en <b>🔎 Similitud</b>: se pinta solo y ahí decides.</p>${miSec(w) || (ME && w.k === ME.key) ? '' : `<button type="button" class="btn blue" data-asim="${esc(w.id)}">🔎 Revisar en Similitud</button>`}</div>` : ''}
  ${link ? `<a class="btn blue" href="${esc(link)}" target="_blank" rel="noopener" style="justify-self:start;text-decoration:none">🔗 Ver el trabajo completo</a>` : ''}
  ${w.st === 'ok' && w.rv ? `<span class="rv">✔ Revisado por ${esc(w.rv)}</span>` : ''}
  ${w.st === 'ok' ? '<button type="button" class="btn soft pdfb" data-pdf>📄 Descargar investigación (PDF)</button>' : ''}
  ${staff ? (own && !ROLE.t ? '<div class="tip">🙈 Este es tu propio trabajo: lo revisará otro Revisor o tu profe.</div>' : miSec(w) ? `<div class="tip">👀 Este trabajo es de tu sección (${MI_G} ${esc(ROLE.rs)}): puedes leerlo, pero lo revisará un Revisor de otra sección o tu profe.</div>` : `<div class="acts"><textarea id="rvFb" maxlength="500" placeholder="Comentario (opcional). Ej.: ¡Buen trabajo! Agrega una foto de tu experimento."></textarea>
    <button type="button" class="btn go" data-rv="ok">✅ Publicar en la revista</button><button type="button" class="btn soft" data-rv="no">✏️ Devolver (se borra)</button>${ROLE.t ? '<button type="button" class="btn red" data-rv="del">🗑 Borrar</button>' : ''}</div>`) : ''}
  ${ROLE.t && w.st === 'ok' && TAB === 'revista' ? `<div class="acts"><button type="button" class="btn blue" data-resia>✨ ${tieneRes(w.d) ? 'Rehacer' : 'Escribir'} Resumen</button><button type="button" class="btn soft" data-rv="pend">↩️ Quitar de la revista</button><button type="button" class="btn red" data-rv="del">🗑 Borrar</button></div>` : ''}
  </div></article>`;
  M.dataset.id = id; M._w = w;
}
$('#modal').addEventListener('click', async e => {
  const M = $('#modal');
  if (e.target === M || e.target.closest('[data-x]')) { M.hidden = true; M.innerHTML = ''; return; }
  if (e.target.closest('[data-word]')) return bajarWord(M.dataset.id, e.target.closest('[data-word]'));
  const as = e.target.closest('[data-asim]'); if (as) { const id = as.dataset.asim; M.hidden = true; M.innerHTML = ''; setTab('similitud'); for (let k = 0; k < 60 && !(SIM.pend && SIM.pend.some(x => x.id === id)); k++) await new Promise(r => setTimeout(r, 100)); return revisarSim(id); }
  if (e.target.closest('[data-smacc]')) return aceptarSim(e.target.closest('[data-smacc]'));
  if (e.target.closest('[data-smcons]')) { const ta = $('#rvFb'), r = SIM.w && SIM.res[SIM.w.id]; if (ta && r) { ta.value = smConsejo(SIM.w, blanco(r)); ta.dataset.sug = '_'; ta.focus(); toast('✨ Consejo listo: puedes cambiarlo antes de devolver.'); } return; }
    if (e.target.closest('[data-pdf]')) { const w = M._w; if (w && window.pdfTrabajo) pdfTrabajo(w); return; }
  if (e.target.closest('[data-resia]')) return resumenPublicado(M.dataset.id, e.target.closest('[data-resia]'));
  const b = e.target.closest('[data-rv]'); if (!b) return;
  const id = M.dataset.id, rej = b.dataset.rv === 'rej', act = rej ? 'no' : b.dataset.rv; let fb = ($('#rvFb') || {}).value ? $('#rvFb').value.trim() : '';
  const borra = act === 'del';                                        // al devolver se queda (sin su Word) para que el estudiante lea el consejo en «Mis envíos»
  const smr = TAB === 'similitud' && SIM.w && SIM.w.id === M.dataset.id && SIM.res[SIM.w.id];
  if (rej) { if (!fb) return toast('❌ Escribe en el cuadro por qué lo rechazas (ej.: no es un tema de Ciencia).', 4500); if (!confirm('Se RECHAZARÁ este trabajo: no se publicará y el estudiante tendrá que hacer uno nuevo. ¿Seguir?')) return; fb = '❌ RECHAZADO: ' + fb; }
  if (act === 'no' && !fb && smr) fb = smConsejo(SIM.w, blanco(smr));
  if (act === 'ok' && smr && smTotal(blanco(smr)) > SM_MAX) { if (!ROLE.t) return toast(`🔒 Tiene ${smTotal(blanco(smr))}% de similitud: sólo se aprueba con ${SM_MAX}% o menos.`, 4500); if (!confirm(`Profe: este trabajo tiene ${smTotal(blanco(smr))}% de similitud (el máximo es ${SM_MAX}%). ¿Aprobarlo igual?`)) return; }
  if (act === 'no' && !rej && !confirm('Se devolverá con tu consejo: el estudiante lo verá en «Mis envíos», lo corregirá y lo volverá a enviar. ¿Seguir?')) return;
  if (act === 'del' && !confirm('¿Borrar este trabajo para siempre?')) return;
  const a = await staffTok(); if (!a) return toast('🔐 Vuelve a entrar para revisar.');
  M.querySelectorAll('[data-rv]').forEach(x => x.disabled = true);
  try {
    let r;
    const sinWord = () => fetch(`${BASE}/revdoc/${encodeURIComponent(id)}?key=${F.apiKey}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + a } }).catch(() => {});
    if (borra) { r = await fetch(`${BASE}/revista/${encodeURIComponent(id)}?key=${F.apiKey}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + a } }); sinWord(); }
    else {
      const up = { st: act, rv: ROLE.t ? 'tu profe' : String(ROLE.rn || ME.name || 'Revisor').slice(0, 60), rvAt: new Date(), fb: fb.slice(0, 500) };
      if (TAB === 'similitud' && RV.w && RV.w.id === id) { const rm = rmTexto(); if (rm) up.rm = rm; }
      r = await patchRev(id, up, a);
    }
    if (!r.ok) throw new Error(r.status === 403 ? 'AUTH' : 'NET');
    if (act === 'ok' || act === 'no') sinWord();                                       // aprobado: queda el librito con su información; el Word ya no hace falta
    M.hidden = true; M.innerHTML = '';
    if (RV.w && RV.w.id === id) { try { localStorage.removeItem(rmK(id)); } catch (x) {} RV.w = null; }
    toast(rej ? '❌ Rechazado: el estudiante verá el motivo en «Mis envíos».' : act === 'no' ? '✏️ Devuelto con tus marcas y el consejo: el estudiante lo verá en su Word Molí.' : act === 'ok' ? '🎉 ¡Publicado en la Revista Innovadora!' : act === 'no' ? '✏️ Devuelto con tu consejo.' : act === 'pend' ? '↩️ Volvió a la bandeja.' : '🗑 Borrado.');
    CACHE.ok = null; if (CACHE.pend) CACHE.pend = CACHE.pend.filter(x => x.id !== id);
    if (TAB === 'bandeja') drawBandeja(); else if (TAB === 'similitud') pintaSim(); else vRevista();
  } catch (x) { M.querySelectorAll('[data-rv]').forEach(y => y.disabled = false); toast(x.message === 'AUTH' ? '🔐 No tienes permiso para esto.' : '📶 No se pudo guardar. Intenta otra vez.', 4500); }
});
// 🚫 los artículos publicados tampoco se copian (sólo la docente); para usarlos está el PDF
['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => { if (ROLE.t || !e.target.closest || !e.target.closest('#modal .art:not(.rv-art) .bd') || e.target.closest('textarea, input, button, a')) return; e.preventDefault(); if (ev === 'copy' || ev === 'cut') toast('🚫 No se puede copiar. Usa «📄 Descargar investigación (PDF)» y cítalo con tus palabras.', 3600); }, true));
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) { $('#modal').hidden = true; $('#modal').innerHTML = ''; } });

(async function () {
  if (ME) { const me = $('#me'); me.hidden = false; me.innerHTML = `<i>${esc((firstName(ME.name)[0] || '🙂').toUpperCase())}</i><span class="nm">${esc(firstName(ME.name) || 'Hola')}</span>${ME.teacher ? '<span class="rol">Docente</span>' : ''}`; }
  await checkRole();
  if (ROLE.t) document.body.classList.add('docente');

  if (ROLE.t) $('#tabs [data-tab="trabajos"]').hidden = false;
  const want = QS.get('v'); setTab(want === 'bandeja' && ROLE.t ? 'bandeja' : want === 'bandeja' && ROLE.r ? 'similitud' : want === 'enviar' ? 'enviar' : want === 'fuentes' ? 'fuentes' : 'revista');
  if (QS.get('rev')) setTimeout(() => verRevision(QS.get('rev')), 60);
  if (TAB === 'enviar' && ME && (QS.get('hoja') || QS.get('nueva'))) setTimeout(() => { const id = QS.get('hoja') || window.nuevaHoja(QS.get('nueva')); if (id) abrirHojaDoc(id); }, 60);
  if ((ROLE.t || ROLE.r) && TAB !== 'bandeja' && TAB !== 'similitud') { try { const a = await staffTok(); if (a) { CACHE.pend = await query('pend', a, ['st']); setCount(CACHE.pend.length); CACHE.pend = null; } } catch (e) {} }
})();
